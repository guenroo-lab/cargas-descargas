<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Plataforma Málaga</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#080a10;--surface:#0f1220;--surface2:#161b2e;
  --red:#e30613;--cyan:#00c2ff;--gold:#f0b429;--green:#22c55e;--blue:#3498db;--purple:#9b59b6;--orange:#f97316;
  --text:#f0f4ff;--muted:#6b7899;--border:rgba(255,255,255,0.07);
  /* Versiones "R,G,B" de los mismos colores, para los fondos/bordes translúcidos
     (rgba(var(--x-rgb),alpha)) — así también cambian de tono al cambiar de tema. */
  --red-rgb:227,6,19;--cyan-rgb:0,194,255;--gold-rgb:240,180,41;--green-rgb:34,197,94;--orange-rgb:249,115,22;--purple-rgb:155,89,182;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 50% at 85% -10%,rgba(var(--red-rgb),.10) 0%,transparent 55%),
  radial-gradient(ellipse 60% 50% at 5% 105%,rgba(var(--cyan-rgb),.06) 0%,transparent 55%);
  pointer-events:none;z-index:0;}
.screen{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:1.8vh 2vw;}

/* CABECERA */
.top{display:flex;align-items:center;gap:1.8vw;margin-bottom:1.4vh;flex-shrink:0;}
.logo{background:#fff;padding:.8vh 1.4vw;border-radius:11px;box-shadow:0 0 0 1px rgba(var(--red-rgb),.4);}
.logo span{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:2.2vh;letter-spacing:.01em;color:var(--red);}
.top h1{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:3vh;letter-spacing:.01em;flex:1;}
.reloj{text-align:right;}
.reloj .hora{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:3.8vh;letter-spacing:.01em;color:var(--cyan);line-height:1;}
.reloj .fecha{font-size:1.4vh;color:var(--muted);text-transform:capitalize;}
.live{display:flex;align-items:center;gap:.5vw;font-size:1.4vh;font-weight:700;letter-spacing:1px;color:var(--green);text-transform:uppercase;}
.live-dot{width:1vh;height:1vh;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin-bottom:1.4vh;flex-shrink:0;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2vh .8vw;text-align:center;}
.kpi .v{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:4.5vh;line-height:1;letter-spacing:.01em;}
.kpi .l{font-size:1.3vh;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:.3vh;}
.kpi.cyan{border-color:rgba(var(--cyan-rgb),.3);} .kpi.cyan .v{color:var(--cyan);}
.kpi.green{border-color:rgba(var(--green-rgb),.3);} .kpi.green .v{color:var(--green);}
.kpi.gold{border-color:rgba(var(--gold-rgb),.3);} .kpi.gold .v{color:var(--gold);}
.kpi.red{border-color:rgba(var(--red-rgb),.3);} .kpi.red .v{color:var(--red);}

/* LAYOUT PRINCIPAL: dos columnas (proporcional al ancho real, no un px fijo:
   en una TV grande un valor fijo se queda diminuto y corta los nombres) */
.main{flex:1;display:grid;grid-template-columns:7fr 3fr;gap:1.2vw;overflow:hidden;min-height:0;}

/* COLUMNA IZQUIERDA: operaciones EN CURSO — cargas arriba, descargas abajo */
.col-ops{display:flex;flex-direction:column;gap:1.1vh;overflow:hidden;min-height:0;}
.ops-zone{flex:1;display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.012);border:1px solid var(--border);border-radius:16px;padding:1vh 1vw .6vh;}
.ops-zone.zone-carga{border-color:rgba(var(--green-rgb),.28);}
.ops-zone.zone-descarga{border-color:rgba(var(--gold-rgb),.28);}
.ops-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(20vw,1fr));grid-auto-rows:minmax(30vh,1fr);gap:1vw;overflow-y:auto;min-height:0;align-content:stretch;}
.ops-grid::-webkit-scrollbar{width:3px;} .ops-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.ops-grid .vacio{grid-column:1/-1;}
/* Cabecera de zona (izquierda y derecha) */
.zone-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7vh;flex-shrink:0;}
.zh-title{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:2.4vh;letter-spacing:.01em;display:flex;align-items:center;gap:.6vw;}
.zh-title i{font-size:2vh;}
.zh-carga .zh-title{color:var(--green);} .zh-descarga .zh-title{color:var(--gold);}
.zh-count{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:2.6vh;line-height:1;min-width:2.4vw;text-align:center;border-radius:8px;padding:.3vh .6vw;}
.zh-carga .zh-count{color:var(--green);background:rgba(var(--green-rgb),.12);}
.zh-descarga .zh-count{color:var(--gold);background:rgba(var(--gold-rgb),.12);}

/* TARJETAS OPERACIONES */
.op{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:1.4vh 1.2vw;position:relative;overflow:hidden;display:flex;flex-direction:column;animation:pop .4s ease both;transition:border-color .6s,box-shadow .6s;}
.op::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;transition:background .6s;}
.op.t-normal.carga  {border-color:rgba(var(--green-rgb),.45);}
.op.t-normal.carga::before{background:linear-gradient(90deg,var(--green),transparent);}
.op.t-normal.descarga{border-color:rgba(var(--gold-rgb),.45);}
.op.t-normal.descarga::before{background:linear-gradient(90deg,var(--gold),transparent);}
.op.t-warn{border-color:rgba(var(--gold-rgb),.75);box-shadow:0 0 24px rgba(var(--gold-rgb),.12);}
.op.t-warn::before{background:linear-gradient(90deg,var(--gold),transparent);}
.op.t-urgent{border-color:rgba(var(--orange-rgb),.85);box-shadow:0 0 28px rgba(var(--orange-rgb),.18);}
.op.t-urgent::before{background:linear-gradient(90deg,var(--orange),transparent);}
.op.t-alert{border-color:rgba(var(--red-rgb),.85);animation:pop .4s ease both,glow-red 2s infinite;}
.op.t-alert::before{background:linear-gradient(90deg,var(--red),transparent);}
.op-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6vh;}
.op-muelle{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:2.6vh;letter-spacing:.01em;}
.op-tipo{font-size:1.3vh;font-weight:700;padding:.3vh .7vw;border-radius:50px;text-transform:uppercase;letter-spacing:1px;}
.badge-carga{background:rgba(var(--green-rgb),.15);color:var(--green);}
.badge-descarga{background:rgba(var(--gold-rgb),.15);color:var(--gold);}
.op-dest{font-size:2vh;font-weight:700;margin-bottom:.2vh;}
.hora-tag{color:var(--gold);}
.op-meta{display:flex;align-items:center;flex-wrap:wrap;gap:.15vw .7vw;margin-bottom:.6vh;}
.op-cat{font-size:1.1vh;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.op-cargador{font-size:1.9vh;font-weight:700;color:var(--text);display:flex;align-items:center;gap:.35vw;min-width:0;}
.op-cargador i{font-size:1.5vh;color:var(--cyan);flex-shrink:0;}
.op-timer-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;min-height:0;}
.op-crono{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(4.5rem,15vh,18vh);letter-spacing:.01em;line-height:1;text-align:center;}
.crono-green{color:var(--green);} .crono-gold{color:var(--gold);}
.crono-orange{color:var(--orange);}
.crono-red{color:var(--red);animation:blink 1.2s infinite;}
.op-desde{font-size:1.3vh;color:var(--muted);text-align:center;}
/* alerta/frase motivadora: ancho fijo al 100% de la tarjeta + min-width:0 en el texto,
   para que SIEMPRE envuelva dentro de la tarjeta en vez de desbordar hacia fuera
   (bug reportado: un mensaje largo se salía de la tarjeta y tapaba "desde HH:mm") */
.op-alerta{display:flex;align-items:flex-start;gap:.4vw;margin-top:.6vh;padding:.5vh .6vw;border-radius:8px;font-size:1.2vh;font-weight:700;width:100%;box-sizing:border-box;line-height:1.35;}
.op-alerta i{font-size:1.4vh;flex-shrink:0;margin-top:.1vh;}
.op-alerta .msg{flex:1 1 auto;min-width:0;overflow-wrap:break-word;word-break:break-word;}
.op-alerta.ok   {background:rgba(var(--green-rgb),.1); border:1px solid rgba(var(--green-rgb),.25);color:var(--green);}
.op-alerta.warn {background:rgba(var(--gold-rgb),.08);border:1px solid rgba(var(--gold-rgb),.2); color:var(--gold);}
.op-alerta.urgent{background:rgba(var(--orange-rgb),.12);border:1px solid rgba(var(--orange-rgb),.3);color:var(--orange);animation:blink 2.5s infinite;}
.op-alerta.alert{background:rgba(var(--red-rgb),.12); border:1px solid rgba(var(--red-rgb),.3);  color:var(--red);animation:blink 2s infinite;}

/* COLUMNA DERECHA: programación del día — cargas arriba, descargas abajo */
.col-prog{display:flex;flex-direction:column;gap:1.1vh;overflow:hidden;min-height:0;}
.prog-zone{flex:1;display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.012);border:1px solid var(--border);border-radius:14px;padding:1vh .8vw .6vh;}
.prog-zone.zone-carga{border-color:rgba(var(--green-rgb),.22);}
.prog-zone.zone-descarga{border-color:rgba(var(--gold-rgb),.22);}
.prog-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.4vh;padding-right:.3vw;min-height:0;}
.prog-scroll::-webkit-scrollbar{width:3px;}
.prog-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* TARJETA PROGRAMACIÓN */
.pg{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.55vh .8vw;display:flex;gap:.7vw;align-items:center;position:relative;overflow:hidden;transition:border-color .3s;}
.pg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.pg.pg-carga::before   {background:var(--green);}
.pg.pg-descarga::before{background:var(--gold);}
.pg.pg-extra::before   {background:var(--purple);}
/* Colores por destino (barra lateral izquierda de cada fila) */
.pg.d-malaga::before  {background:#22c55e;}
.pg.d-marbella::before{background:#3498db;}
.pg.d-mijas::before   {background:#9b59b6;}
.pg.d-torija::before  {background:#e30613;}
.pg.d-valencia::before{background:#f0b429;}
.pg.d-inversa::before {background:#ff5fa2;}
.pg.pg-cursando{border-color:rgba(var(--cyan-rgb),.35);}
.pg.pg-completado{opacity:.45;filter:grayscale(.4);}
.pg-hora{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.9vh;letter-spacing:.01em;min-width:4vw;text-align:center;flex-shrink:0;}
.pg-hora.pg-carga   {color:var(--green);}
.pg-hora.pg-descarga{color:var(--gold);}
.pg-hora.pg-extra   {color:var(--purple);}
/* Color de hora y destino según destino */
.pg-hora.h-malaga,  .pg-dest.h-malaga  {color:#22c55e;}
.pg-hora.h-marbella,.pg-dest.h-marbella{color:#3498db;}
.pg-hora.h-mijas,   .pg-dest.h-mijas   {color:#9b59b6;}
.pg-hora.h-torija,  .pg-dest.h-torija  {color:#e30613;}
.pg-hora.h-valencia,.pg-dest.h-valencia{color:#f0b429;}
.pg-hora.h-inversa, .pg-dest.h-inversa {color:#ff5fa2;}
.pg-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.2vh;}
.pg-dest{font-size:1.5vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.pg-estado{font-size:1vh;font-weight:700;padding:.2vh .5vw;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;flex-shrink:0;}
.e-pendiente{background:var(--surface2);color:var(--muted);}
.e-cursando {background:rgba(var(--cyan-rgb),.15);color:var(--cyan);}
.e-completado{background:rgba(var(--green-rgb),.15);color:var(--green);}
.e-extra{background:rgba(var(--purple-rgb),.15);color:var(--purple);}

/* VACÍO */
.vacio{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);height:100%;text-align:center;}
.vacio i{font-size:5vh;opacity:.3;margin-bottom:1.5vh;}
.vacio p{font-size:1.6vh;}
.vacio.mini i{font-size:3vh;margin-bottom:.6vh;}
.vacio.mini p{font-size:1.3vh;}

/* PANTALLA RANKING — sustituye Cargas/Descargas 3 min de cada hora (día/semana/mes rotando) */
.ranking-screen{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;gap:1.2vh;animation:pop .5s ease both;}
.rk-head{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rk-title{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:3.4vh;letter-spacing:.01em;color:var(--gold);display:flex;align-items:center;gap:.8vw;}
.rk-title i{font-size:3vh;}
.rk-periodo{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:2.2vh;letter-spacing:.01em;color:var(--cyan);background:rgba(var(--cyan-rgb),.1);border:1px solid rgba(var(--cyan-rgb),.3);border-radius:8px;padding:.4vh 1.2vw;}
.rk-body{flex:1;display:grid;grid-template-columns:3.2fr 6.8fr;gap:1.4vw;overflow:hidden;min-height:0;}
.rk-podio{display:flex;flex-direction:column;gap:1vh;overflow-y:auto;min-height:0;}
.rk-pod{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:1.4vh 1.2vw;display:flex;align-items:center;gap:1vw;}
.rk-pod .rk-medal{font-size:4vh;flex-shrink:0;line-height:1;}
.rk-pod .rk-info{flex:1;min-width:0;}
.rk-pod .rk-nombre{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:2.4vh;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-pod .rk-stats{font-size:1.2vh;color:var(--muted);margin-top:.2vh;}
.rk-pod .rk-total{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:4vh;flex-shrink:0;line-height:1;}
.rk-pod.p1{border-color:rgba(var(--gold-rgb),.6);box-shadow:0 0 24px rgba(var(--gold-rgb),.15);} .rk-pod.p1 .rk-total{color:var(--gold);}
.rk-pod.p2{border-color:rgba(199,204,216,.5);} .rk-pod.p2 .rk-total{color:#c7ccd8;}
.rk-pod.p3{border-color:rgba(205,127,50,.5);} .rk-pod.p3 .rk-total{color:#cd7f32;}
.rk-records{display:flex;gap:1vw;flex-shrink:0;margin-bottom:1vh;}
.rk-record{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1vh 1vw;display:flex;align-items:center;gap:.8vw;}
.rk-record i{font-size:2.2vh;color:var(--orange);flex-shrink:0;}
.rk-record .rk-rlabel{font-size:1.1vh;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.rk-record .rk-rval{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.9vh;letter-spacing:.01em;}
.rk-tabla-wrap{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.rk-tabla{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:.5vh;}
.rk-tabla::-webkit-scrollbar{width:3px;} .rk-tabla::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.rk-tabla-head{display:grid;grid-template-columns:2.4vw 1fr repeat(5,minmax(6vw,1fr));gap:.6vw;font-size:1vh;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:0 1vw .5vh;flex-shrink:0;}
.rk-tabla-head>div{text-align:center;}
.rk-fila{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.7vh 1vw;display:grid;grid-template-columns:2.4vw 1fr repeat(5,minmax(6vw,1fr));align-items:center;gap:.6vw;}
.rk-fila .rk-pos{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.7vh;color:var(--muted);text-align:center;}
.rk-fila .rk-nom{font-size:1.5vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-fila .rk-col{text-align:center;}
.rk-fila .rk-col .n{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.7vh;line-height:1;}
.rk-fila .rk-col .l{font-size:.85vh;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes glow-red{0%,100%{box-shadow:0 0 28px rgba(var(--red-rgb),.2);}50%{box-shadow:0 0 48px rgba(var(--red-rgb),.45);}}
.tema-toggle{height:3.6vh;min-width:3.6vh;padding:0 1vw;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:1.8vh;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tema-toggle:hover{border-color:var(--cyan);color:var(--cyan);}

/* ===== TEMA KAIROS =====
   Sistema de temas y tipografía copiados tal cual de Kairos (igual que Centinela):
   modo Oscuro/Claro x acento (Índigo, Verde LM, Rojo Taisa, Ámbar, Retro 80s), Inter
   para todo el texto y Permanent Marker para la marca. La elección se guarda en
   localStorage (taisa_mode_pick / taisa_theme_pick) y vale para todas las pantallas. */
:root {
  --ink-950:#090d13; --ink-900:#0f151e; --ink-850:#141b26; --ink-800:#1a2230;
  --ink-700:#28323f; --ink-600:#3a4757;
  --text-100:#eef2f7; --text-300:#c3ccd8; --text-500:#8b97a8; --text-600:#66707e;
  --radius-card:14px; --radius-btn:10px; --radius-chip:999px;
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  --accent:#e2263a; --accent-ink:#ffffff; --accent-dim:#3a1216; --accent-line:#8a2530; --accent-rgb:226,38,58;
  --accent-text: color-mix(in srgb, var(--accent) 65%, white 35%);
  --bg:var(--ink-950); --surface:var(--ink-900); --surface2:var(--ink-800);
  --text:var(--text-100); --muted:var(--text-500); --border:var(--ink-700);
  --cyan:var(--accent-text); --cyan-rgb:var(--accent-rgb);
  color-scheme:dark;
}
[data-kmode="light"] {
  --ink-950:#f6f4f1; --ink-900:#ffffff; --ink-850:#fbfaf8; --ink-800:#e8e4de;
  --ink-700:#d7d2ca; --ink-600:#b6afa4;
  --text-100:#201f1c; --text-300:#4a473f; --text-500:#7a7568; --text-600:#96917f;
  --shadow-card:0 1px 2px rgba(30,25,15,.04), 0 10px 24px -14px rgba(30,25,15,.18);
  --accent-text: var(--accent);
  color-scheme:light;
}
[data-ktheme="indigo"]   { --accent:#4c7dff; --accent-ink:#ffffff; --accent-dim:#1c2b52; --accent-line:#3a55a8; --accent-rgb:76,125,255; }
[data-ktheme="lmgreen"]  { --accent:#3fb54a; --accent-ink:#04220a; --accent-dim:#123420; --accent-line:#2f7a3c; --accent-rgb:63,181,74; }
[data-ktheme="taisared"] { --accent:#e2263a; --accent-ink:#ffffff; --accent-dim:#3a1216; --accent-line:#8a2530; --accent-rgb:226,38,58; }
[data-ktheme="amber"]    { --accent:#f0a020; --accent-ink:#241400; --accent-dim:#3a2708; --accent-line:#93672a; --accent-rgb:240,160,32; }
[data-kmode="light"][data-ktheme="lmgreen"]  { --accent:#2f9e3f; --accent-ink:#ffffff; --accent-dim:#e4f5e7; --accent-line:#a9dab4; --accent-rgb:47,158,63; }
[data-kmode="light"][data-ktheme="taisared"] { --accent:#dc1a23; --accent-ink:#ffffff; --accent-dim:#fde6e6; --accent-line:#f0aaac; --accent-rgb:220,26,35; }
[data-ktheme="retro80s"]                     { --accent:#FF1493; --accent-ink:#ffffff; --accent-dim:#3a0f28; --accent-line:#a80f5c; --accent-rgb:255,20,147; }
[data-kmode="light"][data-ktheme="retro80s"] { --accent:#d6127a; --accent-ink:#ffffff; --accent-dim:#ffe0f0; --accent-line:#ffb3d9; --accent-rgb:214,18,122; }

html { background:var(--ink-950); }
body {
  font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  background-color:var(--ink-950);
  background-image:
    radial-gradient(900px 620px at -10% -15%, var(--accent) 0%, transparent 55%),
    radial-gradient(800px 700px at 115% 10%, var(--accent-line) 0%, transparent 50%),
    linear-gradient(160deg, var(--ink-950) 0%, var(--ink-900) 55%, var(--ink-950) 100%);
  background-size:auto, auto, 100% 100%;
  background-position:0 0, 0 0, 0 0;
  background-repeat:no-repeat;
  background-attachment:fixed;
  transition:background .15s ease,color .15s ease;
}
[data-kmode="light"] body {
  background-image:
    radial-gradient(900px 620px at -10% -15%, var(--accent) 0%, transparent 50%),
    radial-gradient(800px 700px at 115% 10%, var(--accent-line) 0%, transparent 42%),
    linear-gradient(160deg, var(--ink-950) 0%, var(--ink-800) 55%, var(--ink-950) 100%);
}
body::before { display:none !important; }
[data-kmode="light"] input, [data-kmode="light"] textarea, [data-kmode="light"] select { color-scheme:light !important; }

/* Retro 80s Color-Block (copiado de Kairos): bandas con paradas duras, solo decoración. */
[data-ktheme="retro80s"] .header, [data-ktheme="retro80s"] .top { position:relative; padding-top:16px; }
[data-ktheme="retro80s"] .header::before, [data-ktheme="retro80s"] .top::before {
  content:""; position:absolute; top:0; left:0; right:0; height:6px; border-radius:3px;
  background:linear-gradient(135deg,
    #FF1493 0%, #FF1493 20%, #00C5B5 20%, #00C5B5 40%, #3B2F85 40%, #3B2F85 60%,
    #FFD700 60%, #FFD700 80%, #FF2400 80%, #FF2400 100%);
}
[data-ktheme="retro80s"] .header-title, [data-ktheme="retro80s"] .top h1 {
  background:linear-gradient(135deg,
    #FF1493 0%, #FF1493 25%, #00C5B5 25%, #00C5B5 50%, #3B2F85 50%, #3B2F85 75%, #FFD700 75%, #FFD700 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:none;
}

/* Selector de tema (copiado de Kairos) */
.theme-panel { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:12px; display:none; box-shadow:var(--shadow-card); }
.theme-panel.abierto { display:block; }
.picker-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.picker-row:last-child { margin-bottom:0; }
.picker-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-600); width:52px; flex:none; }
.pick { display:flex; align-items:center; gap:7px; padding:7px 11px 7px 8px; border-radius:var(--radius-chip); background:var(--ink-800); border:1px solid var(--ink-700); color:var(--text-300); font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
.pick .dot { width:13px; height:13px; border-radius:50%; flex:none; }
.pick[data-for="indigo"] .dot { background:#4c7dff; }
.pick[data-for="lmgreen"] .dot { background:#3fb54a; }
.pick[data-for="taisared"] .dot { background:#e2263a; }
.pick[data-for="amber"] .dot { background:#f0a020; }
.pick[data-for="retro80s"] .dot { background:linear-gradient(135deg,
  #FF1493 0%, #FF1493 20%, #00C5B5 20%, #00C5B5 40%, #3B2F85 40%, #3B2F85 60%,
  #FFD700 60%, #FFD700 80%, #FF2400 80%, #FF2400 100%); }
.pick.active { background:var(--accent-dim); border-color:var(--accent-line); color:var(--accent-ink); }
[data-kmode="light"] .pick.active { color:var(--accent); }
.pick[data-hidden] { display:none; }

.header-title, .top h1 {
  font-family:'Permanent Marker', cursive; font-weight:400; letter-spacing:.015em;
  color:var(--accent-text); background:none; -webkit-background-clip:border-box; background-clip:border-box;
  -webkit-text-fill-color:currentColor;
  -webkit-text-stroke:1px var(--ink-950); text-stroke:1px var(--ink-950);
  text-shadow:0 2px 0 rgba(0,0,0,.35), 0 6px 14px color-mix(in srgb, var(--accent) 55%, transparent);
}
[data-kmode="light"] .header-title, [data-kmode="light"] .top h1 {
  -webkit-text-stroke:1px var(--ink-900); text-stroke:1px var(--ink-900);
  text-shadow:0 2px 0 rgba(0,0,0,.15), 0 6px 14px color-mix(in srgb, var(--accent) 45%, transparent);
}

/* Dashboard (TV, medidas en vh): selector bajo el botón de tema y tipografía Inter */
.theme-panel { position:fixed; top:7vh; right:2vw; z-index:1000; width:46vh; padding:1.4vh; }
.picker-label { font-size:1.3vh; width:7vh; }
.pick { font-size:1.6vh; padding:.8vh 1.2vh .8vh 1vh; gap:.8vh; }
.pick .dot { width:1.6vh; height:1.6vh; }
.top h1 { font-size:3.4vh; }
.op-crono { font-size:clamp(3.2rem,8.5vh,10vh); letter-spacing:0; }
/* Colores semánticos (carga/descarga/urgente) más oscuros en modo claro, como el antiguo tema Grafito */
[data-kmode="light"] {
  --gold:#92600e; --gold-rgb:146,96,14;
  --green:#166534; --green-rgb:22,101,52;
  --orange:#b8410a; --orange-rgb:184,65,10;
  --purple:#6d28d9; --purple-rgb:109,40,217;
}
[data-kmode="light"] .ops-zone, [data-kmode="light"] .prog-zone { background:rgba(18,28,50,.025); }

/* Modo calma (?calma=1): sin ninguna animación. Por defecto TODO se mueve siempre, aunque el sistema tenga el
   "movimiento reducido" (Citrix/escritorio remoto lo activa solo y dejaba las pantallas estáticas). */
html.calma *,html.calma *::before,html.calma *::after{animation:none!important;transition:none!important}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes lmGira{to{--ang:360deg}}
@keyframes lmFlujo{to{background-position:-200% 0}}
@keyframes lmFlujoV{to{background-position:0 -200%}}
@keyframes lmFranja{to{background-position:28px 0}}
@keyframes lmAnillo{0%{transform:scale(.7);opacity:.9}100%{transform:scale(3);opacity:0}}
@keyframes lmBrillo{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
@keyframes lmFlash{0%{filter:brightness(1.9);transform:scale(1.1)}100%{filter:none;transform:scale(1)}}
@keyframes lmPulso{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes lmBorde{0%,100%{opacity:.18}50%{opacity:1}}
@keyframes lmBaliza{to{transform:rotate(360deg)}}
@keyframes lmFlecha{50%{transform:translateX(7px)}}

/* ----- Operaciones EN CURSO: la barra de arriba fluye mientras la operación está en marcha, y según el tiempo
   que lleva (45 / 50 / 60 min, los mismos tramos de siempre) la tarjeta respira más rápido, gira una luz por el borde
   y, a partir de los 60 min, se vuelve una alarma. ----- */
.op::before{height:.55vh}
.op.t-normal.carga::before{background:linear-gradient(90deg,var(--green),rgba(var(--green-rgb),.12),var(--green));background-size:200% 100%;animation:lmFlujo 3.2s linear infinite}
.op.t-normal.descarga::before{background:linear-gradient(90deg,var(--gold),rgba(var(--gold-rgb),.12),var(--gold));background-size:200% 100%;animation:lmFlujo 3.2s linear infinite}
.op.t-warn::before{background:linear-gradient(90deg,var(--gold),rgba(var(--gold-rgb),.12),var(--gold));background-size:200% 100%;animation:lmFlujo 2.4s linear infinite}
.op.t-urgent::before{background:linear-gradient(90deg,var(--orange),rgba(var(--orange-rgb),.12),var(--orange));background-size:200% 100%;animation:lmFlujo 1.6s linear infinite}

/* ===== MOVIMIENTO LIGERO (escritorio remoto / Citrix) =====
   Medido en Chrome sin GPU con 8 operaciones y la alarma puesta: movimiento pleno = 185 % de CPU y la pantalla cambia ~54 veces por
   segundo (hasta con 2 operaciones, 87 %); ligero = 10 % y ~3 cambios por segundo. En Citrix cada cambio es una actualización que hay que
   enviar, y con tantos se ve «a fotogramas lentos». Por eso aquí NO hay ninguna animación CSS: el metrónomo del <head> cambia html[data-f]
   entre 0 (fuerte) y 1 (atenuado) cada 800 ms y todo parpadea a la vez. Nada de degradados giratorios, sombras que respiran ni marco a
   pantalla completa. Se activa solo con movimiento reducido del sistema, con la página lenta, con ?mov=ligero o desde el panel «Tema». */
html.mov-ligero *,html.mov-ligero *::before,html.mov-ligero *::after{animation:none!important;transition:none!important}
html.mov-ligero .op::after{display:none}
html.mov-ligero .live-dot::after,html.mov-ligero .aab-beam,html.mov-ligero body.alarma::after{display:none}
html.mov-ligero .op.t-warn{border-color:rgba(var(--gold-rgb),.9)}
html.mov-ligero .op.t-urgent{border-color:rgba(var(--orange-rgb),.95)}
html.mov-ligero .op.t-alert{border-color:var(--red);box-shadow:0 0 2.4vh rgba(var(--red-rgb),.3)}
html.mov-ligero[data-f="1"] .op.t-warn{border-color:rgba(var(--gold-rgb),.3)}
html.mov-ligero[data-f="1"] .op.t-urgent{border-color:rgba(var(--orange-rgb),.3)}
html.mov-ligero[data-f="1"] .op.t-alert{border-color:rgba(var(--red-rgb),.3)}
html.mov-ligero[data-f="1"] :is(.live-dot,.crono-red,.op-alerta.urgent,.op-alerta.alert,.aab-lamp),
html.mov-ligero[data-f="1"] .op-tipo::before{opacity:.3}
html.mov-ligero #alertaOps{border-color:var(--red);
  background:linear-gradient(rgba(var(--red-rgb),.14),rgba(var(--red-rgb),.14)) padding-box,linear-gradient(var(--ink-950),var(--ink-950)) padding-box}
html.mov-ligero[data-f="1"] #alertaOps{border-color:rgba(var(--red-rgb),.3)}
html.mov-ligero[data-f="1"] .aab-cta i{transform:translateX(.6vh)}
html.mov-ligero .pg.pg-pronto{border-color:rgba(var(--cyan-rgb),.95)}
html.mov-ligero .pg.pg-retraso{border-color:rgba(var(--orange-rgb),.95)}
html.mov-ligero[data-f="1"] .pg.pg-pronto{border-color:rgba(var(--cyan-rgb),.3)}
html.mov-ligero[data-f="1"] .pg.pg-retraso{border-color:rgba(var(--orange-rgb),.3)}
/* marco rojo de alarma: 4 tiras finas en los bordes (así solo cambian esos píxeles, no la pantalla entera) */

html.mov-ligero body.alarma .marco-alarma{display:block}

.marco-alarma i:nth-child(1){top:0;left:0;right:0;height:.8vh}
.marco-alarma i:nth-child(2){bottom:0;left:0;right:0;height:.8vh}

<script>
// ===== MOVIMIENTO: perfil pleno | ligero | calma =====
// En un escritorio remoto (Citrix) la pantalla llega como "actualizaciones": cada animación continua obliga a mandar fotogramas sin
// parar y el usuario ve el movimiento a tirones, "a fotogramas lentos". El perfil LIGERO no usa ninguna animación CSS: un metrónomo
// (cada 800 ms) cambia html[data-f] entre 0 y 1 y todo parpadea a la vez (ver el bloque «MOVIMIENTO LIGERO» del CSS).
// Elección: ?mov=pleno|ligero|calma en la URL (no se guarda; ?calma=1 = calma) > panel «Tema» (se guarda) > automático:
// ligero si el sistema pide movimiento reducido (Citrix/escritorio remoto lo activa solo) o si la página va lenta (<26 fps dos veces
// seguidas), pleno en el resto. El perfil pleno es el de siempre.
(function(){
  var K='taisa_mov_pick',h=document.documentElement,st={perfil:'pleno',porque:'',pick:'auto',param:'',n:0,t:null};
  function leer(){try{return localStorage.getItem(K)||'auto';}catch(e){return 'auto';}}
  function reducido(){try{return !!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);}catch(e){return false;}}
  function lento(){try{return sessionStorage.getItem(K+'_auto')==='ligero';}catch(e){return false;}}
  function metronomo(on){
    if(on&&!st.t){st.n=0;h.setAttribute('data-f','0');st.t=setInterval(function(){st.n^=1;h.setAttribute('data-f',String(st.n));},800);}
    else if(!on&&st.t){clearInterval(st.t);st.t=null;h.removeAttribute('data-f');}
  }
  function resolver(){
    var e=st.param||st.pick;
    if(e==='pleno'||e==='ligero'||e==='calma'){st.perfil=e;st.porque=st.param?'?mov= / ?calma=1 en la URL':'elegido a mano en el panel';}
    else if(lento()){st.perfil='ligero';st.porque='automático: la pantalla iba lenta';}
    else if(reducido()){st.perfil='ligero';st.porque='automático: el sistema pide movimiento reducido (escritorio remoto)';}
    else{st.perfil='pleno';st.porque='automático';}
    h.classList.toggle('calma',st.perfil==='calma');
    h.classList.toggle('mov-ligero',st.perfil==='ligero');
    h.setAttribute('data-mov',st.perfil);
    metronomo(st.perfil==='ligero');
    if(window.sincronizarMov_)sincronizarMov_();
  }
  window.lmMov={
    params:function(p){p=p||{};st.param=p.calma==='1'?'calma':((p.mov==='pleno'||p.mov==='ligero'||p.mov==='calma')?p.mov:'');resolver();},
    elegir:function(v){st.pick=v;st.param='';try{localStorage.setItem(K,v);}catch(e){}resolver();},
    estado:function(){return{perfil:st.perfil,porque:st.porque,eleccion:st.param||st.pick};}
  };
  st.pick=leer();resolver();
  // Vigilante: si el movimiento pleno hace ir lenta la página (<26 fps medidos dos veces seguidas, con la ventana visible), pasa a ligero.
  function fps(ms,cb){var c=0,t0=performance.now(),fin=false;(function f(t){c++;if(t-t0<ms)requestAnimationFrame(f);else if(!fin){fin=true;cb(c*1000/(t-t0));}})(t0);setTimeout(function(){if(!fin){fin=true;cb(-1);}},ms+1500);}
  var bajos=0;
  setInterval(function(){
    if(st.perfil!=='pleno'||(st.param||st.pick)!=='auto'||document.visibilityState!=='visible')return;
    fps(2000,function(v){
      if(v<0)return;
      if(v<26){bajos++;if(bajos>=2){try{sessionStorage.setItem(K+'_auto','ligero');}catch(e){}resolver();}}else bajos=0;
    });
  },20000);
})();
// Parámetros de la URL (?calma=1: sin animaciones · ?mov=pleno|ligero|calma · ?diag=1: cuadro de diagnóstico en la pantalla TV).
// En Apps Script la página va dentro de un iframe cuya URL NO lleva la query de fuera (location.search sale vacío):
// se piden con google.script.url.getLocation. Las páginas se enteran con lmParams(function (p) { ... }).
(function(){
  var q={};try{new URLSearchParams(location.search).forEach(function(v,k){q[k]=v;});}catch(e){}
  var oy=[],pub=false,ped=false;
  window.LM_PARAMS=q;
  window.lmParams=function(fn){oy.push(fn);if(pub){try{fn(window.LM_PARAMS);}catch(e){}}};
  function ap(p){if(window.lmMov)lmMov.params(p);}
  function publicar(p){window.LM_PARAMS=p;pub=true;ap(p);for(var i=0;i<oy.length;i++){try{oy[i](p);}catch(e){}}}
  function pedir(){
    if(ped)return true;
    try{
      if(window.google&&google.script&&google.script.url&&google.script.url.getLocation){
        ped=true;
        google.script.url.getLocation(function(loc){var p={},k,de=(loc&&loc.parameter)||{};for(k in q)p[k]=q[k];for(k in de)p[k]=String(de[k]);publicar(p);});
        setTimeout(function(){if(!pub)publicar(q);},4000);
        return true;
      }
    }catch(e){}
    return false;
  }
  ap(q);
  if(!pedir()){document.addEventListener('DOMContentLoaded',function(){if(!pedir())publicar(q);});}
})();
</script>

function reloj(){
  const n=new Date();
  document.getElementById('hora').textContent=n.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});

function fmtCrono(ms){const t=Math.floor(ms/1000);const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return (h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}

// Devuelve la clave de color según el lugar (o 'inversa' si el flujo lleva Inversa)
function _colorDestino(lugar,flujo){
  if(flujo && /inversa/i.test(flujo)) return 'inversa';
  const l=(lugar||'').toLowerCase();
  if(l.indexOf('mijas')>-1)    return 'mijas';
  if(l.indexOf('marbella')>-1) return 'marbella';
  if(l.indexOf('málaga')>-1||l.indexOf('malaga')>-1) return 'malaga';
  if(l.indexOf('torija')>-1)   return 'torija';
  if(l.indexOf('valencia')>-1) return 'valencia';
  return '';
}

// ── RANKING CARGADORES (pantalla rotativa: sustituye Cargas/Descargas 3 min
// de cada hora — minutos :00, :01 y :02 — rotando día/semana/mes cada 55s) ─
const RANKING_PERIODOS=['dia','semana','mes'];
const RANKING_LABELS={dia:'HOY',semana:'ESTA SEMANA',mes:'ESTE MES'};
const RANKING_ROTACION_MS=55000; // 3 períodos × 55s ≈ 165s, cabe en la ventana de 3 min
let rankingActivo=false,rankingData=null,rankingPeriodoIdx=0,rankingRotTimer=null;

function debeMostrarRanking(){return new Date().getMinutes()<3;}
function comprobarRanking(){
  const activar=debeMostrarRanking();
  if(activar&&!rankingActivo){rankingActivo=true;mostrarRanking();}
  else if(!activar&&rankingActivo){rankingActivo=false;ocultarRanking();}
}
function mostrarRanking(){
  document.querySelector('.kpis').style.display='none';
  document.querySelector('.main').style.display='none';
  document.getElementById('rankingScreen').style.display='flex';
  rankingPeriodoIdx=0;
  google.script.run.withSuccessHandler(d=>{rankingData=d;renderRanking();}).obtenerRankingCompleto();
  rankingRotTimer=setInterval(()=>{rankingPeriodoIdx=(rankingPeriodoIdx+1)%RANKING_PERIODOS.length;renderRanking();},RANKING_ROTACION_MS);
}

// Refresco: operaciones + programación. Solo repinta si los datos cambian (evita parpadeo).
let _firmaOps='', _firmaProg='';
function refrescar(){
  google.script.run.withSuccessHandler(d=>{
    if(d){
      if(d.estado){estado=d.estado;renderOps();}
      progHoy=d.plan||[];renderProg();
    }
  }).obtenerDashboard();
}
refrescar();
setInterval(refrescar,30000); // con caché de 60s no hace falta más

// ── OPERACIONES EN CURSO ──────────────────────────────────────────
function renderOps(){
  if(!estado)return;
  const k=estado.kpi||{};
  setKpi('kEnCurso',k.enCursoNum||0);
  setKpi('kComp',k.completadasHoy||0);
  setKpi('kSop',k.soportesHoy||0);
  setKpi('kMedia',k.mediaDur||0);

  const ops=Object.values(estado.enCurso||{}).sort((a,b)=>new Date(a.inicioISO)-new Date(b.inicioISO));
  // Firma: qué operaciones hay y sus datos clave. Si no cambia, NO repintamos (evita parpadeo)
  const firma=ops.map(o=>o.id+'|'+o.muelle+'|'+o.tipo+'|'+o.destino+'|'+o.horaEntrega+'|'+o.inicioISO).join('#');
  if(firma===_firmaOps)return;
  _firmaOps=firma;

  const cargas=ops.filter(o=>o.tipo==='Carga');
  const descargas=ops.filter(o=>o.tipo!=='Carga');
  document.getElementById('cntOpsCarga').textContent=cargas.length;
  document.getElementById('cntOpsDescarga').textContent=descargas.length;
  pintarOps('opsCargas',cargas,'carga');
  pintarOps('opsDescargas',descargas,'descarga');
}

function pintarOps(idCont,lista,tipo){
  const cont=document.getElementById(idCont);
  if(!lista.length){
    cont.innerHTML='<div class="vacio"><i class="fa-solid fa-mug-hot"></i><p>Sin '+(tipo==='carga'?'cargas':'descargas')+' en curso</p></div>';
    return;
  }
  cont.innerHTML=lista.map(op=>{
    const ini=new Date(op.inicioISO).getTime();
    const ms=Date.now()-ini;
    const et=estadoTiempo(ms);
    const tipoCls=op.tipo==='Carga'?'carga':'descarga';
    const tipoBadge=op.tipo==='Carga'?'badge-carga':'badge-descarga';
    const cronoCls=et==='normal'?'crono-green':et==='warn'?'crono-gold':et==='urgent'?'crono-orange':'crono-red';
    const hora=op.horaEntrega?` · <span class="hora-tag">${op.horaEntrega}</span>`:'';
    let msgHTML='';
    if(et==='normal') msgHTML=`<div class="op-alerta ok"><i class="fa-solid fa-bolt"></i><span class="msg">${asignarMsg(op.id)}</span></div>`;
    else if(et==='warn') msgHTML=`<div class="op-alerta warn"><i class="fa-solid fa-check"></i><span class="msg">${MSG_OK}</span></div>`;
    else if(et==='urgent') msgHTML=`<div class="op-alerta urgent"><i class="fa-solid fa-triangle-exclamation"></i><span class="msg">${asignarMsgUrgente(op.id)}</span></div>`;
    else msgHTML=`<div class="op-alerta alert"><i class="fa-solid fa-circle-exclamation"></i><span class="msg">¡ATENCIÓN! Revisar — Jefe equipo</span></div>`;
    return `<div class="op t-${et} ${tipoCls}" data-id="${op.id}">
      <div class="op-top">
        <div class="op-muelle">MUELLE ${op.muelle}</div>
        <div class="op-tipo ${tipoBadge}">${op.tipo}</div>
      </div>
      <div class="op-dest">${op.destino}${hora}</div>
      <div class="op-meta"><span class="op-cat">${catLabel(op.categoria)}</span><span class="op-cargador"><i class="fa-solid fa-user"></i>${op.cargador}</span></div>
      <div class="op-timer-wrap">
        <div class="op-crono ${cronoCls}" data-inicio="${ini}">${fmtCrono(ms)}</div>
        <div class="op-desde">desde ${new Date(ini).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      ${msgHTML}
    </div>`;
  }).join('');
}

// ── PROGRAMACIÓN DEL DÍA ──────────────────────────────────────────
function renderProg(){
  // Firma para evitar repintado innecesario (incluye estado: al completarse una, cambia y se repinta)
  const firma=(progHoy||[]).map(p=>p.fila+'|'+p.hora+'|'+p.estado+'|'+p.destino+'|'+p.origen+'|'+p.flujo).join('#');
  if(firma===_firmaProg)return;
  _firmaProg=firma;
  // Solo lo que queda por hacer: pendientes y en curso. Las realizadas y anuladas DESAPARECEN.
  const activos=(progHoy||[]).filter(p=>p.estado==='Pendiente'||p.estado==='En curso');
  const cargas=activos.filter(p=>p.tipo==='Carga');
  const descargas=activos.filter(p=>p.tipo!=='Carga');
  document.getElementById('cntProgCarga').textContent=cargas.length;
  document.getElementById('cntProgDescarga').textContent=descargas.length;
  pintarProg('progCargas',cargas,'carga');
  pintarProg('progDescargas',descargas,'descarga');
  marcarProg();
}

function pintarProg(idCont,lista,tipo){
  const cont=document.getElementById(idCont);
  if(!lista.length){
    cont.innerHTML='<div class="vacio mini"><i class="fa-solid fa-circle-check"></i><p>'+(tipo==='carga'?'Sin cargas pendientes':'Sin descargas pendientes')+'</p></div>';
    return;
  }
  cont.innerHTML=lista.map(p=>{
    const tipoCls='pg-'+(p.tipo==='Carga'?'carga':'descarga');
    const lugar=p.tipo==='Carga'?p.destino:p.origen;
    // Color por destino (o rosa si lleva flujo Inversa)
    const colorKey=_colorDestino(lugar,p.flujo);
    const horaCls=colorKey?('h-'+colorKey):(p.tipo==='Carga'?'pg-carga':'pg-descarga');
    const barraCls=colorKey?('d-'+colorKey):tipoCls;
    const estadoCls={Pendiente:'e-pendiente','En curso':'e-cursando'}[p.estado]||'e-pendiente';
    return `<div class="pg ${barraCls} ${p.estado==='En curso'?'pg-cursando':''}" data-hora="${p.hora}" data-estado="${p.estado}">
      <div class="pg-hora ${horaCls}">${p.hora}</div>
      <div class="pg-info">
        <div class="pg-dest ${colorKey?('h-'+colorKey):''}">${lugar}</div>
      </div>
      <span class="pg-chip"></span>
      <div class="pg-estado ${estadoCls}">${p.estado}</div>
    </div>`;
  }).join('');
}

// cronómetros vivos
setInterval(()=>{
  document.querySelectorAll('.op-crono').forEach(c=>{
    const ms=Date.now()-Number(c.dataset.inicio);
    c.textContent=fmtCrono(ms);
    const et=estadoTiempo(ms);
    const claseCrono='op-crono '+(et==='normal'?'crono-green':et==='warn'?'crono-gold':et==='urgent'?'crono-orange':'crono-red');
    if(c.className!==claseCrono)c.className=claseCrono;
    const card=c.closest('.op');
    const tipoCls=card.classList.contains('carga')?'carga':'descarga';
    const claseCard=`op t-${et} ${tipoCls}`;
    if(card.className!==claseCard)card.className=claseCard;
    card.dataset.id=card.dataset.id||'';
    const msgEl=card.querySelector('.op-alerta');
    const etActual=msgEl?msgEl.className.replace('op-alerta ','').trim():'';
    if(et==='normal'&&etActual!=='ok'){
      if(msgEl)msgEl.remove();
      const div=document.createElement('div');div.className='op-alerta ok';
      div.innerHTML=`<i class="fa-solid fa-bolt"></i><span class="msg">${asignarMsg(card.dataset.id)}</span>`;card.appendChild(div);
    }else if(et==='warn'&&etActual!=='warn'){
      if(msgEl)msgEl.remove();
      const div=document.createElement('div');div.className='op-alerta warn';
      div.innerHTML=`<i class="fa-solid fa-check"></i><span class="msg">${MSG_OK}</span>`;card.appendChild(div);
    }else if(et==='urgent'&&etActual!=='urgent'){
      if(msgEl)msgEl.remove();
      const div=document.createElement('div');div.className='op-alerta urgent';
      div.innerHTML=`<i class="fa-solid fa-triangle-exclamation"></i><span class="msg">${asignarMsgUrgente(card.dataset.id)}</span>`;card.appendChild(div);
    }else if(et==='alert'&&etActual!=='alert'){
      if(msgEl)msgEl.remove();
      const div=document.createElement('div');div.className='op-alerta alert';
      div.innerHTML=`<i class="fa-solid fa-circle-exclamation"></i><span class="msg">¡ATENCIÓN! Revisar — Jefe equipo</span>`;card.appendChild(div);
    }
  });
},1000);
/* ===== TEMA KAIROS: selector de modo/acento (copiado de Kairos) ===== */
var TEMAS_MODOS = { indigo: ['dark'], lmgreen: ['dark', 'light'], taisared: ['dark', 'light'], amber: ['dark'], retro80s: ['dark', 'light'] };
function toggleThemePanel() {
  var p = document.getElementById('themePanel');
  if (p) p.classList.toggle('abierto');
}
function setKModo(modo) {
  document.documentElement.setAttribute('data-kmode', modo);
  try { localStorage.setItem('taisa_mode_pick', modo); } catch (e) {}
  var actual = document.documentElement.getAttribute('data-ktheme');
  if (!TEMAS_MODOS[actual] || TEMAS_MODOS[actual].indexOf(modo) === -1) setKTema('retro80s'); else sincronizarPickers_();
}
function setKTema(nombre) {
  document.documentElement.setAttribute('data-ktheme', nombre);
  try { localStorage.setItem('taisa_theme_pick', nombre); } catch (e) {}
  sincronizarPickers_();
}
function sincronizarPickers_() {
  var modo = document.documentElement.getAttribute('data-kmode');
  var tema = document.documentElement.getAttribute('data-ktheme');
  var picks = document.querySelectorAll('.pick[data-mode]');
  for (var i = 0; i < picks.length; i++) picks[i].classList.toggle('active', picks[i].getAttribute('data-mode') === modo);
  picks = document.querySelectorAll('.pick[data-for]');
  for (var j = 0; j < picks.length; j++) {
    var p = picks[j];
    var nombre = p.getAttribute('data-for');
    p.toggleAttribute('data-hidden', TEMAS_MODOS[nombre].indexOf(modo) === -1);
    p.classList.toggle('active', nombre === tema);
  }
}
document.addEventListener('click', function (e) {
  var p = document.getElementById('themePanel');
  if (!p || !p.classList.contains('abierto')) return;
  if (e.target.closest('#themePanel') || e.target.closest('#temaBtn')) return;
  p.classList.remove('abierto');
});
sincronizarPickers_();

// Mantener la pantalla activa (Wake Lock): este dashboard suele quedar abierto
// sin ratón/teclado en un PC dedicado (TV del almacén) — sin esto el equipo
// entra en suspensión/bloqueo por inactividad. Se vuelve a pedir solo si el
// navegador lo libera (pestaña minimizada) y vuelve a estar visible.
let wakeLock=null;
async function mantenerPantallaActiva(){
  if(!('wakeLock' in navigator))return;
  try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!wakeLock)mantenerPantallaActiva();});
mantenerPantallaActiva();

/* ===== v62: MOVIMIENTO (alarma de operaciones largas, KPI que parpadean al cambiar, programación que avisa) ===== */
// Pone el HTML solo si ha cambiado: así las animaciones no se reinician cada vez que se repinta
function ponerSiCambia(el,html){if(!el||el.__html===html)return false;el.innerHTML=html;el.__html=html;return true;}
function escH(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
const UMBRAL_ALARMA_MIN=60;  // las mismas que estadoTiempo(): a partir de 60 min la operación es «alert»
const UMBRAL_LV2_MIN=90;     // a los 90 min la alarma sube de nivel
const PRONTO_MIN=15, RETRASO_MIN=15;
function opsEnAlarma(){
  const ahora=Date.now();
  return Object.values((estado&&estado.enCurso)||{}).map(function(o){return {o:o,ms:ahora-new Date(o.inicioISO).getTime()};})
    .filter(function(x){return x.ms>=UMBRAL_ALARMA_MIN*60000;}).sort(function(a,b){return b.ms-a.ms;});
}
function actualizarAlarmaOps(){
  const lista=opsEnAlarma(), hay=lista.length>0;
  const ban=document.getElementById('alertaOps');
  if(ban){
    if(hay){
      const plural=lista.length!==1;
      ban.style.display='flex';
      ponerSiCambia(ban,
        '<span class="aab-ico"><i class="aab-beam"></i><i class="aab-lamp"></i></span>'+
        '<div class="aab-body"><div class="aab-tit">'+lista.length+' operaci'+(plural?'ones llevan':'ón lleva')+' más de '+UMBRAL_ALARMA_MIN+' min</div>'+
        '<div class="aab-det">'+lista.map(function(x){const o=x.o;return '<span class="aab-chip"><b>Muelle '+escH(o.muelle)+'</b> · '+escH(o.destino)+' · '+escH(o.cargador)+'<span class="aab-t" data-inicio="'+new Date(o.inicioISO).getTime()+'"></span></span>';}).join('')+'</div></div>'+
        '<div class="aab-cta">Revisar · Jefe de equipo <i>➜</i></div>');
    }else ban.style.display='none';
  }
  document.body.classList.toggle('alarma',hay);
  document.querySelectorAll('#alertaOps .aab-t').forEach(function(el){el.textContent='⏱ '+fmtCrono(Date.now()-Number(el.dataset.inicio));});
  const lv2=hay&&lista[0].ms>=UMBRAL_LV2_MIN*60000;
  if(ban)ban.classList.toggle('lv2',lv2);
  document.body.classList.toggle('alarma-lv2',lv2);
}
setInterval(actualizarAlarmaOps,1000);
// KPI: al cambiar el número, la tarjeta da un destello (no en la primera carga)
function setKpi(id,v){
  const e=document.getElementById(id);if(!e)return;
  const nuevo=String(v);if(e.textContent===nuevo)return;
  const primera=!e.dataset.listo;
  e.textContent=nuevo;e.dataset.listo='1';
  if(primera)return;
  const c=e.closest('.kpi');if(!c)return;
  c.classList.remove('kpi-flash');void c.offsetWidth;c.classList.add('kpi-flash');
}
// Programación del día: «EN n MIN» (≤15 min para la hora) y «+n MIN» (pendiente con la hora ya pasada ≥15 min)
function marcarProg(){
  const ahora=new Date();
  document.querySelectorAll('.pg[data-hora]').forEach(function(el){
    const m=/^(\d{1,2}):(\d{2})$/.exec(el.dataset.hora||'');
    const chip=el.querySelector('.pg-chip');
    let cls='',txt='';
    if(m&&el.dataset.estado==='Pendiente'){
      const t=new Date(ahora.getFullYear(),ahora.getMonth(),ahora.getDate(),Number(m[1]),Number(m[2]));
      const dif=Math.round((t-ahora)/60000);
      if(dif>=0&&dif<=PRONTO_MIN){cls='pg-pronto';txt='EN '+dif+' MIN';}
      else if(dif<=-RETRASO_MIN){cls='pg-retraso';txt='+'+(-dif)+' MIN';}
    }
    el.classList.toggle('pg-pronto',cls==='pg-pronto');
    el.classList.toggle('pg-retraso',cls==='pg-retraso');
    if(chip&&chip.textContent!==txt)chip.textContent=txt;
  });
}
setInterval(marcarProg,15000);

// === DIAGNÓSTICO (?diag=1): por qué una pantalla no se mueve ===
// Abre la pantalla con &diag=1 al final de la URL y mira el cuadro de abajo a la izquierda. Si NO sale, esa pantalla
// tiene una versión vieja de la página (se actualiza con F5 / Ctrl+F5).
let _diagIniciado=false;
lmParams(function(p){if(p.diag==='1')iniciarDiag();});
function iniciarDiag(){
  if(_diagIniciado)return;
  _diagIniciado=true;
  const caja=document.createElement('div');caja.id='diag';document.body.appendChild(caja);
  let cuadros=0,fps=0,t0=performance.now();
  (function bucle(t){cuadros++;if(t-t0>=1000){fps=Math.round(cuadros*1000/(t-t0));cuadros=0;t0=t;}requestAnimationFrame(bucle);})(t0);
  let gpu='no se pudo leer';
  try{
    const c=document.createElement('canvas');
    const gl=c.getContext('webgl')||c.getContext('experimental-webgl');
    const x=gl&&gl.getExtension('WEBGL_debug_renderer_info');
    gpu=x?String(gl.getParameter(x.UNMASKED_RENDERER_WEBGL)):(gl?'WebGL (sin detalle)':'SIN WebGL (sin aceleración gráfica)');
  }catch(e){}
  const porSoftware=/swiftshader|software|basic render|llvmpipe|sin webgl/i.test(gpu);
  const nav=((navigator.userAgent.match(/(Edg|Chrome|Firefox|Version)\/[\d.]+/g)||[]).pop()||navigator.userAgent.slice(0,30)).replace('Edg/','Edge/').replace('Version/','Safari/');
  function fila(etq,valor,clase){return '<div class="f"><span>'+etq+'</span><span class="'+(clase||'')+'">'+escH(valor)+'</span></div>';}
  function pintar(){
    const reducido=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const calma=document.documentElement.classList.contains('calma');
    const visible=document.visibilityState==='visible';
    let anim='—';try{anim=String(document.getAnimations().length);}catch(e){}
    const mov=lmMov.estado();
    caja.innerHTML='<h4>Diagnóstico de la pantalla</h4>'+
      fila('Perfil de movimiento',mov.perfil.toUpperCase()+' · '+mov.porque,mov.perfil==='pleno'?'ok':(mov.perfil==='ligero'?'av':'mal'))+
      fila('Movimiento reducido (Windows)',reducido?'SÍ · eso activa el perfil ligero (en «Auto»)':'no',reducido?'av':'ok')+
      fila('Modo calma (?calma=1)',calma?'ACTIVADO: sin animaciones':'no',calma?'mal':'ok')+
      fila('Ventana',visible?'visible':'OCULTA: el navegador la pausa',visible?'ok':'mal')+
      fila('Fluidez',fps+' fps',fps>=24?'ok':(fps>0?'av':'mal'))+
      fila('Animaciones en marcha',anim,'')+
      fila('Aceleración gráfica',gpu.slice(0,44),porSoftware?'av':'ok')+
      fila('Navegador',nav+' · '+innerWidth+'×'+innerHeight+' @'+(window.devicePixelRatio||1)+'x','');
  }
  pintar();setInterval(pintar,1000);
}
