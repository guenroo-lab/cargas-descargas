<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Plataforma Málaga</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#080a10;--surface:#0f1220;--surface2:#161b2e;
  --red:#e30613;--cyan:#00c2ff;--gold:#f0b429;--green:#22c55e;--blue:#3498db;--purple:#9b59b6;--orange:#f97316;
  --text:#f0f4ff;--muted:#6b7899;--border:rgba(255,255,255,0.07);
  /* Versiones "R,G,B" de los mismos colores, para los fondos/bordes translúcidos
     (rgba(var(--x-rgb),alpha)) — así también cambian de tono al cambiar de tema. */
  --red-rgb:227,6,19;--cyan-rgb:0,194,255;--gold-rgb:240,180,41;--green-rgb:34,197,94;--orange-rgb:249,115,22;--purple-rgb:155,89,182;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 50% at 85% -10%,rgba(var(--red-rgb),.10) 0%,transparent 55%),
  radial-gradient(ellipse 60% 50% at 5% 105%,rgba(var(--cyan-rgb),.06) 0%,transparent 55%);
  pointer-events:none;z-index:0;}
.screen{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:1.8vh 2vw;}

/* CABECERA */
.top{display:flex;align-items:center;gap:1.8vw;margin-bottom:1.4vh;flex-shrink:0;}
.logo{background:#fff;padding:.8vh 1.4vw;border-radius:11px;box-shadow:0 0 0 1px rgba(var(--red-rgb),.4);}
.logo span{font-family:'Bebas Neue';font-size:2.2vh;letter-spacing:2px;color:var(--red);}
.top h1{font-family:'Bebas Neue';font-size:3vh;letter-spacing:3px;flex:1;}
.reloj{text-align:right;}
.reloj .hora{font-family:'Bebas Neue';font-size:3.8vh;letter-spacing:2px;color:var(--cyan);line-height:1;}
.reloj .fecha{font-size:1.4vh;color:var(--muted);text-transform:capitalize;}
.live{display:flex;align-items:center;gap:.5vw;font-size:1.4vh;font-weight:700;letter-spacing:1px;color:var(--green);text-transform:uppercase;}
.live-dot{width:1vh;height:1vh;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin-bottom:1.4vh;flex-shrink:0;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2vh .8vw;text-align:center;}
.kpi .v{font-family:'Bebas Neue';font-size:4.5vh;line-height:1;letter-spacing:1px;}
.kpi .l{font-size:1.3vh;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:.3vh;}
.kpi.cyan{border-color:rgba(var(--cyan-rgb),.3);} .kpi.cyan .v{color:var(--cyan);}
.kpi.green{border-color:rgba(var(--green-rgb),.3);} .kpi.green .v{color:var(--green);}
.kpi.gold{border-color:rgba(var(--gold-rgb),.3);} .kpi.gold .v{color:var(--gold);}
.kpi.red{border-color:rgba(var(--red-rgb),.3);} .kpi.red .v{color:var(--red);}

/* LAYOUT PRINCIPAL: dos columnas (proporcional al ancho real, no un px fijo:
   en una TV grande un valor fijo se queda diminuto y corta los nombres) */
.main{flex:1;display:grid;grid-template-columns:7fr 3fr;gap:1.2vw;overflow:hidden;min-height:0;}

/* COLUMNA IZQUIERDA: operaciones EN CURSO — cargas arriba, descargas abajo */
.col-ops{display:flex;flex-direction:column;gap:1.1vh;overflow:hidden;min-height:0;}
.ops-zone{flex:1;display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.012);border:1px solid var(--border);border-radius:16px;padding:1vh 1vw .6vh;}
.ops-zone.zone-carga{border-color:rgba(var(--green-rgb),.28);}
.ops-zone.zone-descarga{border-color:rgba(var(--gold-rgb),.28);}
.ops-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(20vw,1fr));grid-auto-rows:minmax(30vh,1fr);gap:1vw;overflow-y:auto;min-height:0;align-content:stretch;}
.ops-grid::-webkit-scrollbar{width:3px;} .ops-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.ops-grid .vacio{grid-column:1/-1;}
/* Cabecera de zona (izquierda y derecha) */
.zone-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7vh;flex-shrink:0;}
.zh-title{font-family:'Bebas Neue';font-size:2.4vh;letter-spacing:2px;display:flex;align-items:center;gap:.6vw;}
.zh-title i{font-size:2vh;}
.zh-carga .zh-title{color:var(--green);} .zh-descarga .zh-title{color:var(--gold);}
.zh-count{font-family:'Bebas Neue';font-size:2.6vh;line-height:1;min-width:2.4vw;text-align:center;border-radius:8px;padding:.3vh .6vw;}
.zh-carga .zh-count{color:var(--green);background:rgba(var(--green-rgb),.12);}
.zh-descarga .zh-count{color:var(--gold);background:rgba(var(--gold-rgb),.12);}

/* TARJETAS OPERACIONES */
.op{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:1.4vh 1.2vw;position:relative;overflow:hidden;display:flex;flex-direction:column;animation:pop .4s ease both;transition:border-color .6s,box-shadow .6s;}
.op::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;transition:background .6s;}
.op.t-normal.carga  {border-color:rgba(var(--green-rgb),.45);}
.op.t-normal.carga::before{background:linear-gradient(90deg,var(--green),transparent);}
.op.t-normal.descarga{border-color:rgba(var(--gold-rgb),.45);}
.op.t-normal.descarga::before{background:linear-gradient(90deg,var(--gold),transparent);}
.op.t-warn{border-color:rgba(var(--gold-rgb),.75);box-shadow:0 0 24px rgba(var(--gold-rgb),.12);}
.op.t-warn::before{background:linear-gradient(90deg,var(--gold),transparent);}
.op.t-urgent{border-color:rgba(var(--orange-rgb),.85);box-shadow:0 0 28px rgba(var(--orange-rgb),.18);}
.op.t-urgent::before{background:linear-gradient(90deg,var(--orange),transparent);}
.op.t-alert{border-color:rgba(var(--red-rgb),.85);animation:pop .4s ease both,glow-red 2s infinite;}
.op.t-alert::before{background:linear-gradient(90deg,var(--red),transparent);}
.op-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6vh;}
.op-muelle{font-family:'Bebas Neue';font-size:2.6vh;letter-spacing:1px;}
.op-tipo{font-size:1.3vh;font-weight:700;padding:.3vh .7vw;border-radius:50px;text-transform:uppercase;letter-spacing:1px;}
.badge-carga{background:rgba(var(--green-rgb),.15);color:var(--green);}
.badge-descarga{background:rgba(var(--gold-rgb),.15);color:var(--gold);}
.op-dest{font-size:2vh;font-weight:700;margin-bottom:.2vh;}
.hora-tag{color:var(--gold);}
.op-meta{display:flex;align-items:center;flex-wrap:wrap;gap:.15vw .7vw;margin-bottom:.6vh;}
.op-cat{font-size:1.1vh;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.op-cargador{font-size:1.9vh;font-weight:700;color:var(--text);display:flex;align-items:center;gap:.35vw;min-width:0;}
.op-cargador i{font-size:1.5vh;color:var(--cyan);flex-shrink:0;}
.op-timer-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;min-height:0;}
.op-crono{font-family:'Bebas Neue';font-size:clamp(4.5rem,15vh,18vh);letter-spacing:2px;line-height:1;text-align:center;}
.crono-green{color:var(--green);} .crono-gold{color:var(--gold);}
.crono-orange{color:var(--orange);}
.crono-red{color:var(--red);animation:blink 1.2s infinite;}
.op-desde{font-size:1.3vh;color:var(--muted);text-align:center;}
/* alerta/frase motivadora: ancho fijo al 100% de la tarjeta + min-width:0 en el texto,
   para que SIEMPRE envuelva dentro de la tarjeta en vez de desbordar hacia fuera
   (bug reportado: un mensaje largo se salía de la tarjeta y tapaba "desde HH:mm") */
.op-alerta{display:flex;align-items:flex-start;gap:.4vw;margin-top:.6vh;padding:.5vh .6vw;border-radius:8px;font-size:1.2vh;font-weight:700;width:100%;box-sizing:border-box;line-height:1.35;}
.op-alerta i{font-size:1.4vh;flex-shrink:0;margin-top:.1vh;}
.op-alerta .msg{flex:1 1 auto;min-width:0;overflow-wrap:break-word;word-break:break-word;}
.op-alerta.ok   {background:rgba(var(--green-rgb),.1); border:1px solid rgba(var(--green-rgb),.25);color:var(--green);}
.op-alerta.warn {background:rgba(var(--gold-rgb),.08);border:1px solid rgba(var(--gold-rgb),.2); color:var(--gold);}
.op-alerta.urgent{background:rgba(var(--orange-rgb),.12);border:1px solid rgba(var(--orange-rgb),.3);color:var(--orange);animation:blink 2.5s infinite;}
.op-alerta.alert{background:rgba(var(--red-rgb),.12); border:1px solid rgba(var(--red-rgb),.3);  color:var(--red);animation:blink 2s infinite;}

/* COLUMNA DERECHA: programación del día — cargas arriba, descargas abajo */
.col-prog{display:flex;flex-direction:column;gap:1.1vh;overflow:hidden;min-height:0;}
.prog-zone{flex:1;display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.012);border:1px solid var(--border);border-radius:14px;padding:1vh .8vw .6vh;}
.prog-zone.zone-carga{border-color:rgba(var(--green-rgb),.22);}
.prog-zone.zone-descarga{border-color:rgba(var(--gold-rgb),.22);}
.prog-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.4vh;padding-right:.3vw;min-height:0;}
.prog-scroll::-webkit-scrollbar{width:3px;}
.prog-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* TARJETA PROGRAMACIÓN */
.pg{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.55vh .8vw;display:flex;gap:.7vw;align-items:center;position:relative;overflow:hidden;transition:border-color .3s;}
.pg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.pg.pg-carga::before   {background:var(--green);}
.pg.pg-descarga::before{background:var(--gold);}
.pg.pg-extra::before   {background:var(--purple);}
/* Colores por destino (barra lateral izquierda de cada fila) */
.pg.d-malaga::before  {background:#22c55e;}
.pg.d-marbella::before{background:#3498db;}
.pg.d-mijas::before   {background:#9b59b6;}
.pg.d-torija::before  {background:#e30613;}
.pg.d-valencia::before{background:#f0b429;}
.pg.d-inversa::before {background:#ff5fa2;}
.pg.pg-cursando{border-color:rgba(var(--cyan-rgb),.35);}
.pg.pg-completado{opacity:.45;filter:grayscale(.4);}
.pg-hora{font-family:'Bebas Neue';font-size:1.9vh;letter-spacing:1px;min-width:4vw;text-align:center;flex-shrink:0;}
.pg-hora.pg-carga   {color:var(--green);}
.pg-hora.pg-descarga{color:var(--gold);}
.pg-hora.pg-extra   {color:var(--purple);}
/* Color de hora y destino según destino */
.pg-hora.h-malaga,  .pg-dest.h-malaga  {color:#22c55e;}
.pg-hora.h-marbella,.pg-dest.h-marbella{color:#3498db;}
.pg-hora.h-mijas,   .pg-dest.h-mijas   {color:#9b59b6;}
.pg-hora.h-torija,  .pg-dest.h-torija  {color:#e30613;}
.pg-hora.h-valencia,.pg-dest.h-valencia{color:#f0b429;}
.pg-hora.h-inversa, .pg-dest.h-inversa {color:#ff5fa2;}
.pg-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.2vh;}
.pg-dest{font-size:1.5vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.pg-estado{font-size:1vh;font-weight:700;padding:.2vh .5vw;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;flex-shrink:0;}
.e-pendiente{background:var(--surface2);color:var(--muted);}
.e-cursando {background:rgba(var(--cyan-rgb),.15);color:var(--cyan);}
.e-completado{background:rgba(var(--green-rgb),.15);color:var(--green);}
.e-extra{background:rgba(var(--purple-rgb),.15);color:var(--purple);}

/* VACÍO */
.vacio{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);height:100%;text-align:center;}
.vacio i{font-size:5vh;opacity:.3;margin-bottom:1.5vh;}
.vacio p{font-size:1.6vh;}
.vacio.mini i{font-size:3vh;margin-bottom:.6vh;}
.vacio.mini p{font-size:1.3vh;}

/* PANTALLA RANKING — sustituye Cargas/Descargas 3 min de cada hora (día/semana/mes rotando) */
.ranking-screen{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;gap:1.2vh;animation:pop .5s ease both;}
.rk-head{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rk-title{font-family:'Bebas Neue';font-size:3.4vh;letter-spacing:3px;color:var(--gold);display:flex;align-items:center;gap:.8vw;}
.rk-title i{font-size:3vh;}
.rk-periodo{font-family:'Bebas Neue';font-size:2.2vh;letter-spacing:2px;color:var(--cyan);background:rgba(var(--cyan-rgb),.1);border:1px solid rgba(var(--cyan-rgb),.3);border-radius:8px;padding:.4vh 1.2vw;}
.rk-body{flex:1;display:grid;grid-template-columns:3.2fr 6.8fr;gap:1.4vw;overflow:hidden;min-height:0;}
.rk-podio{display:flex;flex-direction:column;gap:1vh;overflow-y:auto;min-height:0;}
.rk-pod{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:1.4vh 1.2vw;display:flex;align-items:center;gap:1vw;}
.rk-pod .rk-medal{font-size:4vh;flex-shrink:0;line-height:1;}
.rk-pod .rk-info{flex:1;min-width:0;}
.rk-pod .rk-nombre{font-family:'Bebas Neue';font-size:2.4vh;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-pod .rk-stats{font-size:1.2vh;color:var(--muted);margin-top:.2vh;}
.rk-pod .rk-total{font-family:'Bebas Neue';font-size:4vh;flex-shrink:0;line-height:1;}
.rk-pod.p1{border-color:rgba(var(--gold-rgb),.6);box-shadow:0 0 24px rgba(var(--gold-rgb),.15);} .rk-pod.p1 .rk-total{color:var(--gold);}
.rk-pod.p2{border-color:rgba(199,204,216,.5);} .rk-pod.p2 .rk-total{color:#c7ccd8;}
.rk-pod.p3{border-color:rgba(205,127,50,.5);} .rk-pod.p3 .rk-total{color:#cd7f32;}
.rk-records{display:flex;gap:1vw;flex-shrink:0;margin-bottom:1vh;}
.rk-record{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1vh 1vw;display:flex;align-items:center;gap:.8vw;}
.rk-record i{font-size:2.2vh;color:var(--orange);flex-shrink:0;}
.rk-record .rk-rlabel{font-size:1.1vh;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.rk-record .rk-rval{font-family:'Bebas Neue';font-size:1.9vh;letter-spacing:1px;}
.rk-tabla-wrap{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.rk-tabla{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:.5vh;}
.rk-tabla::-webkit-scrollbar{width:3px;} .rk-tabla::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.rk-tabla-head{display:grid;grid-template-columns:2.4vw 1fr repeat(5,minmax(6vw,1fr));gap:.6vw;font-size:1vh;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:0 1vw .5vh;flex-shrink:0;}
.rk-tabla-head>div{text-align:center;}
.rk-fila{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.7vh 1vw;display:grid;grid-template-columns:2.4vw 1fr repeat(5,minmax(6vw,1fr));align-items:center;gap:.6vw;}
.rk-fila .rk-pos{font-family:'Bebas Neue';font-size:1.7vh;color:var(--muted);text-align:center;}
.rk-fila .rk-nom{font-size:1.5vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rk-fila .rk-col{text-align:center;}
.rk-fila .rk-col .n{font-family:'Bebas Neue';font-size:1.7vh;line-height:1;}
.rk-fila .rk-col .l{font-size:.85vh;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
@keyframes glow-red{0%,100%{box-shadow:0 0 28px rgba(var(--red-rgb),.2);}50%{box-shadow:0 0 48px rgba(var(--red-rgb),.45);}}
/* ===== TEMAS (6) =====
   Oscuro (por defecto, sin atributo) · Claro · Negro OLED · Océano · Ámbar · Grafito.
   Solo cambian fondo/superficie/texto y el acento "en vivo" (--cyan — el nombre se
   mantiene por compatibilidad aunque el tono cambie según el tema). Verde/dorado/
   naranja/rojo son SEMÁNTICOS (carga/descarga/urgente/alerta): en los 4 temas oscuros
   se dejan igual que el Oscuro para no romper la asociación visual del equipo; en los
   2 temas claros se oscurecen (si no, se "queman" sobre fondo blanco y no se ven bien
   los detalles — el problema que reportó Pedro con el tema Claro).
   El rojo de marca (--red, #e30613) NO cambia en ningún tema. */
[data-theme="negro"]{
  --bg:#000000;--surface:#0b0b0e;--surface2:#151519;
  --cyan:#5b8dff;--cyan-rgb:91,141,255;
  --text:#ffffff;--muted:#7a8296;--border:rgba(255,255,255,.09);
}
[data-theme="oceano"]{
  --bg:#05171d;--surface:#0a2129;--surface2:#123039;
  --cyan:#2dd4bf;--cyan-rgb:45,212,191;
  --text:#eaf6f6;--muted:#6b8c92;--border:rgba(255,255,255,.08);
}
[data-theme="ambar"]{
  --bg:#130f0a;--surface:#1c1610;--surface2:#261d13;
  --cyan:#ffb454;--cyan-rgb:255,180,84;
  --text:#fbf1e6;--muted:#8c7c68;--border:rgba(255,255,255,.08);
}
[data-theme="claro"]{
  --bg:#eef1f4;--surface:#ffffff;--surface2:#e7ebf1;
  --cyan:#0369a1;--cyan-rgb:3,105,161;
  --gold:#9a5b0a;--gold-rgb:154,91,10;
  --green:#157a3d;--green-rgb:21,122,61;
  --orange:#c2410c;--orange-rgb:194,65,12;
  --purple:#7c3aed;--purple-rgb:124,58,237;
  --text:#12202e;--muted:#55627a;--border:rgba(18,28,50,.14);
}
[data-theme="grafito"]{
  --bg:#dde2ea;--surface:#f2f4f8;--surface2:#e3e7ee;
  --cyan:#4338ca;--cyan-rgb:67,56,202;
  --gold:#92600e;--gold-rgb:146,96,14;
  --green:#166534;--green-rgb:22,101,52;
  --orange:#b8410a;--orange-rgb:184,65,10;
  --purple:#6d28d9;--purple-rgb:109,40,217;
  --text:#161f2e;--muted:#525d70;--border:rgba(22,31,46,.16);
}
[data-theme="claro"] .ops-zone,[data-theme="claro"] .prog-zone,
[data-theme="grafito"] .ops-zone,[data-theme="grafito"] .prog-zone{background:rgba(18,28,50,.025);}
.tema-toggle{height:3.6vh;min-width:3.6vh;padding:0 1vw;border-radius:9px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:1.8vh;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tema-toggle:hover{border-color:var(--cyan);color:var(--cyan);}
</style>
<script>(function(){try{
  var TEMAS=['oscuro','claro','negro','oceano','ambar','grafito'];
  var p=new URLSearchParams(location.search).get('theme');
  var t=p||localStorage.getItem('taisa_theme')||'oscuro';
  if(t==='light')t='claro'; if(t==='dark')t='oscuro'; // compat con el valor guardado antes de tener 6 temas
  if(TEMAS.indexOf(t)>-1 && t!=='oscuro') document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();</script>
</head>
<body>

function reloj(){

function fmtCrono(ms){const t=Math.floor(ms/1000);const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return (h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}

// Devuelve la clave de color según el lugar (o 'inversa' si el flujo lleva Inversa)
function _colorDestino(lugar,flujo){
  if(flujo && /inversa/i.test(flujo)) return 'inversa';
  const l=(lugar||'').toLowerCase();
  if(l.indexOf('mijas')>-1)    return 'mijas';
  if(l.indexOf('marbella')>-1) return 'marbella';
  if(l.indexOf('málaga')>-1||l.indexOf('malaga')>-1) return 'malaga';
  if(l.indexOf('torija')>-1)   return 'torija';
  if(l.indexOf('valencia')>-1) return 'valencia';
  return '';
}

// ── RANKING CARGADORES (pantalla rotativa: sustituye Cargas/Descargas 3 min
// de cada hora — minutos :00, :01 y :02 — rotando día/semana/mes cada 55s) ─
const RANKING_PERIODOS=['dia','semana','mes'];
const RANKING_LABELS={dia:'HOY',semana:'ESTA SEMANA',mes:'ESTE MES'};
const RANKING_ROTACION_MS=55000; // 3 períodos × 55s ≈ 165s, cabe en la ventana de 3 min
let rankingActivo=false,rankingData=null,rankingPeriodoIdx=0,rankingRotTimer=null;

function debeMostrarRanking(){return new Date().getMinutes()<3;}
function comprobarRanking(){
  const activar=debeMostrarRanking();
  if(activar&&!rankingActivo){rankingActivo=true;mostrarRanking();}
  else if(!activar&&rankingActivo){rankingActivo=false;ocultarRanking();}
}
function mostrarRanking(){
  document.querySelector('.kpis').style.display='none';
  document.querySelector('.main').style.display='none';
  document.getElementById('rankingScreen').style.display='flex';
  rankingPeriodoIdx=0;
  google.script.run.withSuccessHandler(d=>{rankingData=d;renderRanking();}).obtenerRankingCompleto();
  rankingRotTimer=setInterval(()=>{rankingPeriodoIdx=(rankingPeriodoIdx+1)%RANKING_PERIODOS.length;renderRanking();},RANKING_ROTACION_MS);
}
function ocultarRanking(){
  document.querySelector('.kpis').style.display='';
  document.querySelector('.main').style.display='';
  document.getElementById('rankingScreen').style.display='none';
  if(rankingRotTimer){clearInterval(rankingRotTimer);rankingRotTimer=null;}
}
function renderRanking(){
  if(!rankingData)return;
  const periodo=RANKING_PERIODOS[rankingPeriodoIdx];
  const d=rankingData[periodo];
  if(!d)return;
  document.getElementById('rkPeriodo').textContent=RANKING_LABELS[periodo]+(d.desde!==d.hasta?` · ${d.desde} - ${d.hasta}`:'');

  const medallas=['🥇','🥈','🥉'];
  document.getElementById('rkPodio').innerHTML=d.cargadores.length?d.cargadores.slice(0,3).map((c,i)=>`
    <div class="rk-pod p${i+1}">
      <div class="rk-medal">${medallas[i]}</div>
      <div class="rk-info">
        <div class="rk-nombre">${c.nombre}</div>
        <div class="rk-stats">${c.cargas} cargas · ${c.descargas} descargas · ${c.soportes} soportes</div>
      </div>
      <div class="rk-total">${c.total}</div>
    </div>`).join(''):'<div class="vacio mini"><i class="fa-solid fa-box-open"></i><p>Sin operaciones en este período</p></div>';

  let rec='';
  if(d.recordVelocidad)rec+=`<div class="rk-record"><i class="fa-solid fa-bolt"></i><div><div class="rk-rlabel">Tiempo récord</div><div class="rk-rval">${d.recordVelocidad.nombre} · ${d.recordVelocidad.min} min (${d.recordVelocidad.destino})</div></div></div>`;
  if(d.recordSoportes)rec+=`<div class="rk-record"><i class="fa-solid fa-boxes-stacked"></i><div><div class="rk-rlabel">Más soportes en una op.</div><div class="rk-rval">${d.recordSoportes.nombre} · ${d.recordSoportes.soportes} (${d.recordSoportes.destino})</div></div></div>`;
  document.getElementById('rkRecords').innerHTML=rec;

  document.getElementById('rkTabla').innerHTML=d.cargadores.map((c,i)=>`
    <div class="rk-fila">
      <div class="rk-pos">${i+1}</div>
      <div class="rk-nom">${c.nombre}</div>
      <div class="rk-col"><div class="n">${c.cargas}</div></div>
      <div class="rk-col"><div class="n">${c.descargas}</div></div>
      <div class="rk-col"><div class="n">${c.total}</div></div>
      <div class="rk-col"><div class="n">${c.soportes}</div></div>
      <div class="rk-col"><div class="n">${c.mediaMin}/${c.mejorMin!=null?c.mejorMin:'—'}</div><div class="l">min</div></div>
    </div>`).join('');
}
comprobarRanking();
setInterval(comprobarRanking,5000);

// Refresco: operaciones + programación. Solo repinta si los datos cambian (evita parpadeo).
let _firmaOps='', _firmaProg='';
function refrescar(){
  google.script.run.withSuccessHandler(d=>{
    if(d){
      if(d.estado){estado=d.estado;renderOps();}
      progHoy=d.plan||[];renderProg();
    }
  }).obtenerDashboard();
}
refrescar();
setInterval(refrescar,30000); // con caché de 60s no hace falta más

// ── OPERACIONES EN CURSO ──────────────────────────────────────────
function renderOps(){
  if(!estado)return;
  const k=estado.kpi||{};
  document.getElementById('kEnCurso').textContent=k.enCursoNum||0;
  document.getElementById('kComp').textContent=k.completadasHoy||0;
  document.getElementById('kSop').textContent=k.soportesHoy||0;
  document.getElementById('kMedia').textContent=k.mediaDur||0;

  const ops=Object.values(estado.enCurso||{}).sort((a,b)=>new Date(a.inicioISO)-new Date(b.inicioISO));
  // Firma: qué operaciones hay y sus datos clave. Si no cambia, NO repintamos (evita parpadeo)
  const firma=ops.map(o=>o.id+'|'+o.muelle+'|'+o.tipo+'|'+o.destino+'|'+o.horaEntrega+'|'+o.inicioISO).join('#');
  if(firma===_firmaOps)return;
  _firmaOps=firma;

  const cargas=ops.filter(o=>o.tipo==='Carga');
  const descargas=ops.filter(o=>o.tipo!=='Carga');
  document.getElementById('cntOpsCarga').textContent=cargas.length;
  document.getElementById('cntOpsDescarga').textContent=descargas.length;
  pintarOps('opsCargas',cargas,'carga');
  pintarOps('opsDescargas',descargas,'descarga');
}

function pintarOps(idCont,lista,tipo){
  const cont=document.getElementById(idCont);
  if(!lista.length){
    cont.innerHTML='<div class="vacio"><i class="fa-solid fa-mug-hot"></i><p>Sin '+(tipo==='carga'?'cargas':'descargas')+' en curso</p></div>';
    return;
  }
  cont.innerHTML=lista.map(op=>{
    const ini=new Date(op.inicioISO).getTime();
    const ms=Date.now()-ini;
    const et=estadoTiempo(ms);
    const tipoCls=op.tipo==='Carga'?'carga':'descarga';
    const tipoBadge=op.tipo==='Carga'?'badge-carga':'badge-descarga';
    const cronoCls=et==='normal'?'crono-green':et==='warn'?'crono-gold':et==='urgent'?'crono-orange':'crono-red';
    const hora=op.horaEntrega?` · <span class="hora-tag">${op.horaEntrega}</span>`:'';
    let msgHTML='';
    if(et==='normal') msgHTML=`<div class="op-alerta ok"><i class="fa-solid fa-bolt"></i><span class="msg">${asignarMsg(op.id)}</span></div>`;
    else if(et==='warn') msgHTML=`<div class="op-alerta warn"><i class="fa-solid fa-check"></i><span class="msg">${MSG_OK}</span></div>`;
    else if(et==='urgent') msgHTML=`<div class="op-alerta urgent"><i class="fa-solid fa-triangle-exclamation"></i><span class="msg">${asignarMsgUrgente(op.id)}</span></div>`;
    else msgHTML=`<div class="op-alerta alert"><i class="fa-solid fa-circle-exclamation"></i><span class="msg">¡ATENCIÓN! Revisar — Jefe equipo</span></div>`;
    return `<div class="op t-${et} ${tipoCls}" data-id="${op.id}">
      <div class="op-top">
        <div class="op-muelle">MUELLE ${op.muelle}</div>
        <div class="op-tipo ${tipoBadge}">${op.tipo}</div>
      </div>
      <div class="op-dest">${op.destino}${hora}</div>
      <div class="op-meta"><span class="op-cat">${catLabel(op.categoria)}</span><span class="op-cargador"><i class="fa-solid fa-user"></i>${op.cargador}</span></div>
      <div class="op-timer-wrap">
        <div class="op-crono ${cronoCls}" data-inicio="${ini}">${fmtCrono(ms)}</div>
        <div class="op-desde">desde ${new Date(ini).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      ${msgHTML}
    </div>`;
  }).join('');
}

// ── PROGRAMACIÓN DEL DÍA ──────────────────────────────────────────
function renderProg(){
  // Firma para evitar repintado innecesario (incluye estado: al completarse una, cambia y se repinta)
  const firma=(progHoy||[]).map(p=>p.fila+'|'+p.hora+'|'+p.estado+'|'+p.destino+'|'+p.origen+'|'+p.flujo).join('#');
  if(firma===_firmaProg)return;
  _firmaProg=firma;
  // Solo lo que queda por hacer: pendientes y en curso. Las realizadas y anuladas DESAPARECEN.
  const activos=(progHoy||[]).filter(p=>p.estado==='Pendiente'||p.estado==='En curso');
  const cargas=activos.filter(p=>p.tipo==='Carga');
  const descargas=activos.filter(p=>p.tipo!=='Carga');
  document.getElementById('cntProgCarga').textContent=cargas.length;
  document.getElementById('cntProgDescarga').textContent=descargas.length;
  pintarProg('progCargas',cargas,'carga');
  pintarProg('progDescargas',descargas,'descarga');
}

function pintarProg(idCont,lista,tipo){
  const cont=document.getElementById(idCont);
  if(!lista.length){
    cont.innerHTML='<div class="vacio mini"><i class="fa-solid fa-circle-check"></i><p>'+(tipo==='carga'?'Sin cargas pendientes':'Sin descargas pendientes')+'</p></div>';
    return;
  }
  cont.innerHTML=lista.map(p=>{
    const tipoCls='pg-'+(p.tipo==='Carga'?'carga':'descarga');
    const lugar=p.tipo==='Carga'?p.destino:p.origen;
    // Color por destino (o rosa si lleva flujo Inversa)
    const colorKey=_colorDestino(lugar,p.flujo);
    const horaCls=colorKey?('h-'+colorKey):(p.tipo==='Carga'?'pg-carga':'pg-descarga');
    const barraCls=colorKey?('d-'+colorKey):tipoCls;
    const estadoCls={Pendiente:'e-pendiente','En curso':'e-cursando'}[p.estado]||'e-pendiente';
    return `<div class="pg ${barraCls} ${p.estado==='En curso'?'pg-cursando':''}">
      <div class="pg-hora ${horaCls}">${p.hora}</div>
      <div class="pg-info">
        <div class="pg-dest ${colorKey?('h-'+colorKey):''}">${lugar}</div>
      </div>
      <div class="pg-estado ${estadoCls}">${p.estado}</div>
    </div>`;
  }).join('');
}

// cronómetros vivos
setInterval(()=>{
  document.querySelectorAll('.op-crono').forEach(c=>{
    const ms=Date.now()-Number(c.dataset.inicio);
    c.textContent=fmtCrono(ms);
    const et=estadoTiempo(ms);
    c.className='op-crono '+(et==='normal'?'crono-green':et==='warn'?'crono-gold':et==='urgent'?'crono-orange':'crono-red');
    const card=c.closest('.op');
    const tipoCls=card.classList.contains('carga')?'carga':'descarga';
    card.className=`op t-${et} ${tipoCls}`;
    card.dataset.id=card.dataset.id||'';
    const msgEl=card.querySelector('.op-alerta');
    const etActual=msgEl?msgEl.className.replace('op-alerta ','').trim():'';
    if(et==='normal'&&etActual!=='ok'){
      if(msgEl)msgEl.remove();
      const div=document.createElement('div');div.className='op-alerta ok';
      div.innerHTML=`<i class="fa-solid fa-bolt"></i><span class="msg">${asignarMsg(card.dataset.id)}</span>`;card.appendChild(div);
    }else if(et==='warn'&&etActual!=='warn'){
      if(msgEl)msgEl.remove();
      const div=document.createElement('div');div.className='op-alerta warn';
      div.innerHTML=`<i class="fa-solid fa-check"></i><span class="msg">${MSG_OK}</span>`;card.appendChild(div);
    }else if(et==='urgent'&&etActual!=='urgent'){
      if(msgEl)msgEl.remove();
      const div=document.createElement('div');div.className='op-alerta urgent';
      div.innerHTML=`<i class="fa-solid fa-triangle-exclamation"></i><span class="msg">${asignarMsgUrgente(card.dataset.id)}</span>`;card.appendChild(div);
    }else if(et==='alert'&&etActual!=='alert'){
      if(msgEl)msgEl.remove();
      const div=document.createElement('div');div.className='op-alerta alert';
      div.innerHTML=`<i class="fa-solid fa-circle-exclamation"></i><span class="msg">¡ATENCIÓN! Revisar — Jefe equipo</span>`;card.appendChild(div);
    }
  });
},1000);
const TEMAS=['oscuro','claro','negro','oceano','ambar','grafito'];
const TEMA_NOMBRES={oscuro:'Oscuro',claro:'Claro',negro:'Negro OLED',oceano:'Océano',ambar:'Ámbar',grafito:'Grafito'};
function temaActual(){return document.documentElement.getAttribute('data-theme')||'oscuro';}
function aplicarTema(t){
  if(t==='oscuro')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('taisa_theme',t);}catch(e){}
  const btn=document.getElementById('temaBtn');
  if(btn)btn.title='Tema: '+TEMA_NOMBRES[t]+' (clic para cambiar)';
}
function cycleTema(){const i=TEMAS.indexOf(temaActual());aplicarTema(TEMAS[(i+1)%TEMAS.length]);}
aplicarTema(temaActual());

// Mantener la pantalla activa (Wake Lock): este dashboard suele quedar abierto
// sin ratón/teclado en un PC dedicado (TV del almacén) — sin esto el equipo
// entra en suspensión/bloqueo por inactividad. Se vuelve a pedir solo si el
// navegador lo libera (pestaña minimizada) y vuelve a estar visible.
let wakeLock=null;
async function mantenerPantallaActiva(){
  if(!('wakeLock' in navigator))return;
  try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!wakeLock)mantenerPantallaActiva();});
mantenerPantallaActiva();
</script>
