<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#080a10;--surface:#0f1220;--surface2:#161b2e;--red:#e30613;--red-dim:rgba(227,6,19,.12);--cyan:#00c2ff;--gold:#f0b429;--green:#22c55e;--blue:#3498db;--purple:#9b59b6;--text:#f0f4ff;--muted:#6b7899;--border:rgba(255,255,255,0.07);--radius:18px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:90px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 80% -10%,rgba(227,6,19,.08) 0%,transparent 60%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:20px 16px 40px;}
.header{text-align:center;margin-bottom:18px;}
.logo-wrap{display:inline-flex;background:#fff;padding:10px 22px;border-radius:13px;margin-bottom:12px;box-shadow:0 0 0 1px rgba(227,6,19,.35),0 12px 30px rgba(0,0,0,.5);}
.logo-wrap img{height:34px;width:auto;display:block;}
.header-title{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:2rem;letter-spacing:.01em;background:linear-gradient(135deg,#fff 30%,#6b7899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header-sub{color:var(--muted);font-size:.85rem;}
.divider{width:50px;height:3px;background:var(--red);border-radius:2px;margin:10px auto 0;}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;}
/* Pestañas */
.tabs-jefe{display:flex;gap:8px;margin-bottom:18px;}
.tab-jefe{flex:1;padding:13px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.tab-jefe.active{background:var(--red);border-color:var(--red);color:#fff;}
.tab-jefe i{font-size:13px;}
/* Seguimiento: dos columnas */
.seg-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.seg-col{display:flex;flex-direction:column;gap:8px;}
.seg-head{border-radius:14px;padding:14px;text-align:center;position:relative;overflow:hidden;}
.seg-head-carga{background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(34,197,94,.05));border:1px solid rgba(34,197,94,.3);}
.seg-head-descarga{background:linear-gradient(135deg,rgba(240,180,41,.18),rgba(240,180,41,.05));border:1px solid rgba(240,180,41,.3);}
.seg-head-title{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.4rem;letter-spacing:.01em;margin-bottom:8px;}
.seg-head-carga .seg-head-title{color:var(--green);}
.seg-head-descarga .seg-head-title{color:var(--gold);}
.seg-counts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
.seg-count{display:flex;flex-direction:column;align-items:center;min-width:48px;}
.seg-count-num{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.8rem;line-height:1;letter-spacing:.01em;}
.seg-count-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:2px;}
.c-pend{color:var(--muted);} .c-curso{color:var(--cyan);} .c-hecho{color:var(--green);}
.seg-list{display:flex;flex-direction:column;gap:6px;}
.seg-item{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;}
.seg-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;}
.seg-item.s-pendiente::before{background:var(--muted);}
.seg-item.s-curso::before{background:var(--cyan);}
.seg-item.s-curso{border-color:rgba(var(--cyan-rgb),.4);box-shadow:0 0 16px rgba(var(--cyan-rgb),.1);}
.seg-item.s-hecho::before{background:var(--green);}
.seg-item.s-hecho{opacity:.55;}
.seg-item.s-anulado::before{background:var(--red);}
.seg-item.s-anulado{opacity:.4;}
.seg-item.s-anulado .seg-dest,.seg-item.s-anulado .seg-hora{text-decoration:line-through;}
.seg-hora{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.3rem;letter-spacing:.01em;min-width:48px;text-align:center;}
.seg-info{flex:1;min-width:0;}
.seg-dest{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seg-flujo{font-size:10px;color:var(--muted);margin-top:2px;}
.seg-estado-ic{font-size:16px;flex-shrink:0;}
.ic-pendiente{color:var(--muted);} .ic-curso{color:var(--cyan);} .ic-hecho{color:var(--green);} .ic-anulado{color:var(--red);}
.seg-vacio{text-align:center;color:var(--muted);padding:30px 10px;font-size:12px;}
@media(max-width:560px){.seg-cols{grid-template-columns:1fr;}}
.toolbar .fecha{flex:1;color:var(--muted);font-size:13px;}
.toolbar .fecha b{color:var(--cyan);}
.btn-add{background:var(--green);color:#04210f;border:none;border-radius:12px;padding:12px 18px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
.btn-add:hover{filter:brightness(1.08);}
.lista{display:flex;flex-direction:column;gap:9px;}
.tr{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden;}
.tr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.tr.carga::before{background:var(--green);} .tr.descarga::before{background:var(--gold);} .tr.extra::before{background:var(--purple);}
.tr.anulado{opacity:.5;}
.tr.anulado .tr-dest,.tr.anulado .tr-hora{text-decoration:line-through;}
.tr-hora{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.5rem;letter-spacing:.01em;min-width:62px;text-align:center;}
.tr-hora.carga{color:var(--green);} .tr-hora.descarga{color:var(--gold);} .tr-hora.extra{color:var(--purple);}
.tr-info{flex:1;min-width:0;}
.tr-dest{font-size:15px;font-weight:700;}
.tr-meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.pill{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700;text-transform:uppercase;}
.pill.extra{color:var(--purple);border-color:rgba(155,89,182,.3);}
.pill.anulado{color:var(--red);border-color:rgba(227,6,19,.3);}
.tr-tipo{font-size:10px;font-weight:700;padding:2px 8px;border-radius:50px;text-transform:uppercase;}
.tt-carga{background:rgba(34,197,94,.15);color:var(--green);} .tt-descarga{background:rgba(240,180,41,.15);color:var(--gold);}
.btn-anular{background:var(--red-dim);border:1px solid rgba(227,6,19,.25);color:#ff6b6b;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
.btn-anular:hover{background:rgba(227,6,19,.2);}
.btn-anular:disabled{opacity:.4;cursor:default;}
.vacio{text-align:center;color:var(--muted);padding:50px 20px;}
.vacio i{font-size:32px;opacity:.3;display:block;margin-bottom:14px;}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,5,9,.85);backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border-top:3px solid var(--green);border-radius:22px 22px 0 0;width:100%;max-width:680px;padding:22px 18px 30px;max-height:92vh;overflow-y:auto;animation:up .3s ease;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-title{font-family:'Inter',sans-serif;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.5rem;letter-spacing:.01em;}
.modal-close{background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;}
.campo{margin-bottom:14px;}
.campo label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:7px;}
.opt-grid{display:grid;gap:8px;}
.opt-grid.dos{grid-template-columns:1fr 1fr;} .opt-grid.tres{grid-template-columns:repeat(3,1fr);} .opt-grid.cuatro{grid-template-columns:repeat(4,1fr);}
.chip{padding:12px 8px;border:2px solid var(--border);border-radius:11px;text-align:center;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;background:var(--surface2);transition:all .15s;}
.chip.sel{background:var(--red);border-color:var(--red);color:#fff;}
.chip.sel-flow{background:rgba(var(--cyan-rgb),.12);border-color:var(--cyan);color:var(--cyan);}
input[type=date],input[type=time],input[type=number],textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:11px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;padding:12px 14px;outline:none;color-scheme:dark;}
input:focus,textarea:focus{border-color:var(--green);}
textarea{resize:none;min-height:60px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-guardar{width:100%;padding:14px;background:var(--green);color:#04210f;border:none;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:6px;}
.btn-guardar:disabled{opacity:.5;}
.msg{display:none;padding:11px;border-radius:11px;font-size:13px;font-weight:600;text-align:center;margin-top:12px;}
.msg.ok{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:var(--green);}
.msg.err{display:block;background:var(--red-dim);border:1px solid rgba(227,6,19,.25);color:#ff6b6b;}
.spinner{width:15px;height:15px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;}
.loading{text-align:center;color:var(--muted);padding:40px;}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== TEMA KAIROS =====
   Sistema de temas y tipografía copiados tal cual de Kairos (igual que Centinela):
   modo Oscuro/Claro x acento (Índigo, Verde LM, Rojo Taisa, Ámbar, Retro 80s), Inter
   para todo el texto y Permanent Marker para la marca. La elección se guarda en
   localStorage (taisa_mode_pick / taisa_theme_pick) y vale para todas las pantallas. */
:root {
  --ink-950:#090d13; --ink-900:#0f151e; --ink-850:#141b26; --ink-800:#1a2230;
  --ink-700:#28323f; --ink-600:#3a4757;
  --text-100:#eef2f7; --text-300:#c3ccd8; --text-500:#8b97a8; --text-600:#66707e;
  --radius-card:14px; --radius-btn:10px; --radius-chip:999px;
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  --accent:#e2263a; --accent-ink:#ffffff; --accent-dim:#3a1216; --accent-line:#8a2530; --accent-rgb:226,38,58;
  --accent-text: color-mix(in srgb, var(--accent) 65%, white 35%);
  --bg:var(--ink-950); --surface:var(--ink-900); --surface2:var(--ink-800);
  --text:var(--text-100); --muted:var(--text-500); --border:var(--ink-700);
  --cyan:var(--accent-text); --cyan-rgb:var(--accent-rgb);
  color-scheme:dark;
}
[data-kmode="light"] {
  --ink-950:#f6f4f1; --ink-900:#ffffff; --ink-850:#fbfaf8; --ink-800:#e8e4de;
  --ink-700:#d7d2ca; --ink-600:#b6afa4;
  --text-100:#201f1c; --text-300:#4a473f; --text-500:#7a7568; --text-600:#96917f;
  --shadow-card:0 1px 2px rgba(30,25,15,.04), 0 10px 24px -14px rgba(30,25,15,.18);
  --accent-text: var(--accent);
  color-scheme:light;
}
[data-ktheme="indigo"]   { --accent:#4c7dff; --accent-ink:#ffffff; --accent-dim:#1c2b52; --accent-line:#3a55a8; --accent-rgb:76,125,255; }
[data-ktheme="lmgreen"]  { --accent:#3fb54a; --accent-ink:#04220a; --accent-dim:#123420; --accent-line:#2f7a3c; --accent-rgb:63,181,74; }
[data-ktheme="taisared"] { --accent:#e2263a; --accent-ink:#ffffff; --accent-dim:#3a1216; --accent-line:#8a2530; --accent-rgb:226,38,58; }
[data-ktheme="amber"]    { --accent:#f0a020; --accent-ink:#241400; --accent-dim:#3a2708; --accent-line:#93672a; --accent-rgb:240,160,32; }
[data-kmode="light"][data-ktheme="lmgreen"]  { --accent:#2f9e3f; --accent-ink:#ffffff; --accent-dim:#e4f5e7; --accent-line:#a9dab4; --accent-rgb:47,158,63; }
[data-kmode="light"][data-ktheme="taisared"] { --accent:#dc1a23; --accent-ink:#ffffff; --accent-dim:#fde6e6; --accent-line:#f0aaac; --accent-rgb:220,26,35; }
[data-ktheme="retro80s"]                     { --accent:#FF1493; --accent-ink:#ffffff; --accent-dim:#3a0f28; --accent-line:#a80f5c; --accent-rgb:255,20,147; }
[data-kmode="light"][data-ktheme="retro80s"] { --accent:#d6127a; --accent-ink:#ffffff; --accent-dim:#ffe0f0; --accent-line:#ffb3d9; --accent-rgb:214,18,122; }

html { background:var(--ink-950); }
body {
  font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
  background-color:var(--ink-950);
  background-image:
    radial-gradient(900px 620px at -10% -15%, var(--accent) 0%, transparent 55%),
    radial-gradient(800px 700px at 115% 10%, var(--accent-line) 0%, transparent 50%),
    linear-gradient(160deg, var(--ink-950) 0%, var(--ink-900) 55%, var(--ink-950) 100%);
  background-size:auto, auto, 100% 100%;
  background-position:0 0, 0 0, 0 0;
  background-repeat:no-repeat;
  background-attachment:fixed;
  transition:background .15s ease,color .15s ease;
}
[data-kmode="light"] body {
  background-image:
    radial-gradient(900px 620px at -10% -15%, var(--accent) 0%, transparent 50%),
    radial-gradient(800px 700px at 115% 10%, var(--accent-line) 0%, transparent 42%),
    linear-gradient(160deg, var(--ink-950) 0%, var(--ink-800) 55%, var(--ink-950) 100%);
}
body::before { display:none !important; }
[data-kmode="light"] input, [data-kmode="light"] textarea, [data-kmode="light"] select { color-scheme:light !important; }

/* Retro 80s Color-Block (copiado de Kairos): bandas con paradas duras, solo decoración. */
[data-ktheme="retro80s"] .header, [data-ktheme="retro80s"] .top { position:relative; padding-top:16px; }
[data-ktheme="retro80s"] .header::before, [data-ktheme="retro80s"] .top::before {
  content:""; position:absolute; top:0; left:0; right:0; height:6px; border-radius:3px;
  background:linear-gradient(135deg,
    #FF1493 0%, #FF1493 20%, #00C5B5 20%, #00C5B5 40%, #3B2F85 40%, #3B2F85 60%,
    #FFD700 60%, #FFD700 80%, #FF2400 80%, #FF2400 100%);
}
[data-ktheme="retro80s"] .header-title, [data-ktheme="retro80s"] .top h1 {
  background:linear-gradient(135deg,
    #FF1493 0%, #FF1493 25%, #00C5B5 25%, #00C5B5 50%, #3B2F85 50%, #3B2F85 75%, #FFD700 75%, #FFD700 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:none;
}

/* Selector de tema (copiado de Kairos) */
.theme-panel { background:var(--ink-900); border:1px solid var(--ink-800); border-radius:var(--radius-card); padding:12px; display:none; box-shadow:var(--shadow-card); }
.theme-panel.abierto { display:block; }
.picker-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.picker-row:last-child { margin-bottom:0; }
.picker-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-600); width:52px; flex:none; }
.pick { display:flex; align-items:center; gap:7px; padding:7px 11px 7px 8px; border-radius:var(--radius-chip); background:var(--ink-800); border:1px solid var(--ink-700); color:var(--text-300); font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
.pick .dot { width:13px; height:13px; border-radius:50%; flex:none; }
.pick[data-for="indigo"] .dot { background:#4c7dff; }
.pick[data-for="lmgreen"] .dot { background:#3fb54a; }
.pick[data-for="taisared"] .dot { background:#e2263a; }
.pick[data-for="amber"] .dot { background:#f0a020; }
.pick[data-for="retro80s"] .dot { background:linear-gradient(135deg,
  #FF1493 0%, #FF1493 20%, #00C5B5 20%, #00C5B5 40%, #3B2F85 40%, #3B2F85 60%,
  #FFD700 60%, #FFD700 80%, #FF2400 80%, #FF2400 100%); }
.pick.active { background:var(--accent-dim); border-color:var(--accent-line); color:var(--accent-ink); }
[data-kmode="light"] .pick.active { color:var(--accent); }
.pick[data-hidden] { display:none; }

.header-title, .top h1 {
  font-family:'Permanent Marker', cursive; font-weight:400; letter-spacing:.015em;
  color:var(--accent-text); background:none; -webkit-background-clip:border-box; background-clip:border-box;
  -webkit-text-fill-color:currentColor;
  -webkit-text-stroke:1px var(--ink-950); text-stroke:1px var(--ink-950);
  text-shadow:0 2px 0 rgba(0,0,0,.35), 0 6px 14px color-mix(in srgb, var(--accent) 55%, transparent);
}
[data-kmode="light"] .header-title, [data-kmode="light"] .top h1 {
  -webkit-text-stroke:1px var(--ink-900); text-stroke:1px var(--ink-900);
  text-shadow:0 2px 0 rgba(0,0,0,.15), 0 6px 14px color-mix(in srgb, var(--accent) 45%, transparent);
}

/* Controles primarios con el acento (como .btn-primary / .tabs a.activa de Kairos) */
.chip.sel, .tab-jefe.active { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn-red, #guardar {
  background:linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
  color:var(--accent-ink);
  box-shadow:0 10px 24px -10px color-mix(in srgb, var(--accent) 70%, transparent), 0 1px 0 rgba(255,255,255,.25) inset;
}
[data-ktheme="retro80s"] .btn-red, [data-ktheme="retro80s"] #guardar {
  background:linear-gradient(135deg,
    #FF1493 0%, #FF1493 20%, #00C5B5 20%, #00C5B5 40%, #3B2F85 40%, #3B2F85 60%,
    #FFD700 60%, #FFD700 80%, #FF2400 80%, #FF2400 100%);
  color:#fff;
}
input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.modal { border-top-color:var(--accent); }
.divider { background:var(--accent); }
.section-title i { color:var(--accent-text); }
[data-ktheme="retro80s"] .divider { width:110px; height:5px; border-radius:3px;
  background:linear-gradient(90deg,#FF1493 0 20%,#00C5B5 20% 40%,#3B2F85 40% 60%,#FFD700 60% 80%,#FF2400 80% 100%); }
.tema-toggle { position:fixed; top:12px; right:12px; z-index:1000; width:44px; height:44px; border-radius:50%; background:var(--ink-800); border:1px solid var(--ink-700); color:var(--text-100); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.28); }
.tema-toggle:hover { border-color:var(--accent); color:var(--accent-text); }
.theme-panel { position:fixed; top:64px; right:12px; z-index:1000; width:min(340px, calc(100vw - 24px)); }
</style>
<script>(function(){try{
  var m='light',t='retro80s';
  try{m=localStorage.getItem('taisa_mode_pick')||'light';t=localStorage.getItem('taisa_theme_pick')||'retro80s';}catch(e){}
  var OK={indigo:['dark'],lmgreen:['dark','light'],taisared:['dark','light'],amber:['dark'],retro80s:['dark','light']};
  if(m!=='dark')m='light';
  if(!OK[t]||OK[t].indexOf(m)===-1)t='retro80s';
  document.documentElement.setAttribute('data-kmode',m);
  document.documentElement.setAttribute('data-ktheme',t);
}catch(e){}})();</script>
</head>
<body>
<button class="tema-toggle" id="temaBtn" onclick="toggleThemePanel()" aria-label="Tema" title="Tema (modo y acento)" type="button"><i class="fa-solid fa-palette"></i></button>
<div class="theme-panel" id="themePanel">

<script>
let CFG={tiendas:{},plataformas:{},agencias:[],flujos:[]};
const sel={tipo:null,destino:null,categoria:null,flujos:[]};
// Última lista de transportes activos que se pintó en "Gestionar". anular() la usa
// para mandar al backend una "foto" del transporte (tipo/lugar/hora/estado), no solo
// el número de fila, porque ese número puede quedar desactualizado si alguien añade
// un transporte mientras la pantalla sigue abierta (ver B2B.gs _resolverFilaAnular).
let ULTIMO_ACTIVOS=[];

const hoy=new Date();
const hoyISO=hoy.toISOString().split('T')[0];
document.getElementById('fechaVista').value=hoyISO;
document.getElementById('segFecha').value=hoyISO;
document.getElementById('hoyTxt').textContent=hoy.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});

google.script.run.withSuccessHandler(c=>{if(c){CFG=c;}}).obtenerConfig();
cargarSeguimiento();  // arranca en la pestaña Seguimiento

function cambiarFecha(){
  const val=document.getElementById('fechaVista').value;
  if(!val)return;
  const d=new Date(val+'T00:00:00');
  document.getElementById('hoyTxt').textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  cargar();
}

function _fechaParaBackend(){
  // Convierte el valor del input (yyyy-MM-dd) a dd/MM/yyyy para el backend
  const val=document.getElementById('fechaVista').value||hoyISO;
  const [aa,mo,dd]=val.split('-');
  return `${dd}/${mo}/${aa}`;
}

function cargar(){
  document.getElementById('lista').innerHTML='<div class="loading"><span class="spinner" style="display:inline-block;border-top-color:var(--cyan)"></span> Cargando...</div>';
  google.script.run.withSuccessHandler(render).withFailureHandler(e=>{
    document.getElementById('lista').innerHTML='<div class="vacio"><i class="fa-solid fa-triangle-exclamation"></i>Error: '+e.message+'</div>';
  }).getPlanDelDiaB2B(_fechaParaBackend());
}

function render(prog){
  const l=document.getElementById('lista');
  // Solo transportes ACTIVOS: pendientes o en curso (no cargados/descargados ni anulados)
  const activos=(prog||[]).filter(p=>p.estado==='Pendiente'||p.estado==='En curso');
  ULTIMO_ACTIVOS=activos;
  if(!activos.length){l.innerHTML='<div class="vacio"><i class="fa-solid fa-calendar-check"></i>No hay transportes activos para anular este día</div>';return;}
  l.innerHTML=activos.map(p=>{
    const tc=p.tipo==='Carga'?'carga':'descarga';
    const flujos=(p.flujo||'').split(',').filter(Boolean).map(f=>'<span class="pill">'+f.trim()+'</span>').join('');
    const ext=p.anadido?'<span class="pill extra">AÑADIDO</span>':'';
    const estPill=p.estado==='En curso'?'<span class="pill" style="color:var(--cyan);border-color:rgba(var(--cyan-rgb),.3)">EN CURSO</span>':'';
    const tipoBadge='<span class="tr-tipo tt-'+(p.tipo==='Carga'?'carga':'descarga')+'">'+p.tipo+'</span>';
    const sop=p.soportes?'<span class="pill"><i class="fa-solid fa-pallet"></i> '+p.soportes+'</span>':'';
    const lugar=p.tipo==='Carga'?p.destino:p.origen;
    return '<div class="tr '+tc+'">'+
      '<div class="tr-hora '+tc+'">'+(p.hora||'--')+'</div>'+
      '<div class="tr-info"><div class="tr-dest">'+lugar+'</div>'+
        '<div class="tr-meta">'+tipoBadge+ext+estPill+flujos+sop+'</div></div>'+
      '<button class="btn-anular" onclick="anular('+p.fila+',this)"><i class="fa-solid fa-ban"></i> Anular</button>'+
    '</div>';
  }).join('');
}

function anular(numFila,btn){
  // Buscamos la "foto" del transporte tal como se pintó, para que el backend pueda
  // comprobar que la fila sigue siendo la misma antes de anularla (ver B2B.gs).
  const p=ULTIMO_ACTIVOS.find(x=>x.fila===numFila);
  if(!p){alert('La lista ha cambiado. Refresca la pantalla e inténtalo de nuevo.');return;}
  if(!confirm('¿Anular este transporte? Se tachará en el B2B y se enviará aviso a administración.'))return;
  const esperado={
    tipoB2B:p.tipoB2B,
    lugar:(p.tipo==='Carga'?p.destino:p.origen),
    hora:p.hora,
    estado:p.estado,
    flujo:p.flujo||'',
    soportes:p.soportes||''
  };
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  google.script.run.withSuccessHandler(r=>{
    if(r.ok){cargar();}else{alert(r.mensaje);btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-ban"></i> Anular';}
  }).withFailureHandler(e=>{alert('Error: '+e.message);btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-ban"></i> Anular';})
    .jefeAnularEnB2B(numFila,'Jefe de equipo',_fechaParaBackend(),esperado);
}

function abrirAdd(){
  sel.destino=null;
  document.getElementById('msgAdd').className='msg';
  document.getElementById('addFecha').value=new Date().toISOString().split('T')[0];
  document.getElementById('addHora').value='';
  document.getElementById('addNotas').value='';
  chips('addTiendas',Object.keys(CFG.tiendas||{Málaga:1,Marbella:1,Mijas:1}),(v,b)=>{sel.destino=v;mark('addTiendas',b);});
  abrir('modalAdd');
}
function chips(id,items,fn){const el=document.getElementById(id);el.innerHTML='';items.forEach(v=>{const b=document.createElement('div');b.className='chip';b.textContent=v;b.onclick=()=>fn(v,b);el.appendChild(b);});}
function mark(id,btn){document.querySelectorAll('#'+id+' .chip').forEach(c=>c.classList.toggle('sel',c===btn));}

function guardarAdd(){
  if(!sel.destino)return msg('Selecciona la tienda de destino.');
  if(!document.getElementById('addFecha').value)return msg('Indica la fecha.');
  if(!document.getElementById('addHora').value)return msg('Indica la hora de entrega.');
  const [aa,mo,dd]=document.getElementById('addFecha').value.split('-');
  const btn=document.getElementById('btnAdd');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Enviando...';
  google.script.run.withSuccessHandler(r=>{
    if(r.ok){
      document.getElementById('msgAdd').className='msg ok';
      document.getElementById('msgAdd').textContent=r.mensaje;
      setTimeout(()=>{
        cerrar('modalAdd');
        // Cambiar vista al día del transporte añadido para verlo
        document.getElementById('fechaVista').value=document.getElementById('addFecha').value;
        cambiarFecha();
      },1200);
    } else {
      msg(r.mensaje);btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> Añadir y notificar';
    }
  }).withFailureHandler(e=>{msg('Error: '+e.message);btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> Añadir y notificar';})
    .jefeAnadirAlB2B({tipo:'Carga',destino:sel.destino,categoria:'tienda',fecha:dd+'/'+mo+'/'+aa,hora:document.getElementById('addHora').value,notas:document.getElementById('addNotas').value.trim(),autor:'Jefe de equipo'});
}
function msg(t){const m=document.getElementById('msgAdd');m.className='msg err';m.textContent=t;}
function abrir(id){document.getElementById(id).classList.add('show');}
function cerrar(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-bg').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('show');}));

// ===== PESTAÑAS =====
function cambiarTab(t){
  document.querySelectorAll('.tab-jefe').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  document.getElementById('vista-gestionar').style.display=(t==='gestionar')?'block':'none';
  document.getElementById('vista-seguimiento').style.display=(t==='seguimiento')?'block':'none';
  if(t==='gestionar'){cargar();}
  if(t==='seguimiento'){
    if(!document.getElementById('segFecha').value){
      document.getElementById('segFecha').value=hoyISO;
    }
    cargarSeguimiento();
  }
}

// ===== SEGUIMIENTO =====
function cargarSeguimiento(){
  const val=document.getElementById('segFecha').value||hoyISO;
  const d=new Date(val+'T00:00:00');
  document.getElementById('segFechaTxt').textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  const [aa,mo,dd]=val.split('-');
  document.getElementById('segCargas').innerHTML='<div class="seg-vacio"><span class="spinner" style="display:inline-block;border-top-color:var(--cyan)"></span></div>';
  document.getElementById('segDescargas').innerHTML='';
  google.script.run.withSuccessHandler(renderSeguimiento).withFailureHandler(e=>{
    document.getElementById('segCargas').innerHTML='<div class="seg-vacio">Error: '+e.message+'</div>';
  }).getPlanDelDiaB2B(`${dd}/${mo}/${aa}`);
}

function renderSeguimiento(plan){
  plan=plan||[];
  const cargas=plan.filter(p=>p.tipo==='Carga');
  const descargas=plan.filter(p=>p.tipo==='Descarga');
  pintarSegColumna('segCargas','segCargasCounts',cargas);
  pintarSegColumna('segDescargas','segDescargasCounts',descargas);
}

function pintarSegColumna(idLista,idCounts,items){
  // Contadores
  const pend=items.filter(p=>p.estado==='Pendiente').length;
  const curso=items.filter(p=>p.estado==='En curso').length;
  const hecho=items.filter(p=>p.estado==='Completado').length;
  document.getElementById(idCounts).innerHTML=
    '<div class="seg-count"><span class="seg-count-num c-pend">'+pend+'</span><span class="seg-count-lbl">Pendientes</span></div>'+
    '<div class="seg-count"><span class="seg-count-num c-curso">'+curso+'</span><span class="seg-count-lbl">En curso</span></div>'+
    '<div class="seg-count"><span class="seg-count-num c-hecho">'+hecho+'</span><span class="seg-count-lbl">Hechas</span></div>';

  const cont=document.getElementById(idLista);
  if(!items.length){cont.innerHTML='<div class="seg-vacio">Sin transportes este día</div>';return;}
  cont.innerHTML=items.map(p=>{
    const anulado=p.estado==='Anulado';
    let cls,ic;
    if(anulado){cls='s-anulado';ic='<i class="fa-solid fa-ban seg-estado-ic ic-anulado"></i>';}
    else if(p.estado==='En curso'){cls='s-curso';ic='<i class="fa-solid fa-spinner seg-estado-ic ic-curso"></i>';}
    else if(p.estado==='Completado'){cls='s-hecho';ic='<i class="fa-solid fa-circle-check seg-estado-ic ic-hecho"></i>';}
    else {cls='s-pendiente';ic='<i class="fa-regular fa-clock seg-estado-ic ic-pendiente"></i>';}
    const lugar=p.tipo==='Carga'?p.destino:p.origen;
    const flujo=p.flujo?'<div class="seg-flujo">'+p.flujo+'</div>':'';
    return '<div class="seg-item '+cls+'">'+
      '<div class="seg-hora">'+(p.hora||'--')+'</div>'+
      '<div class="seg-info"><div class="seg-dest">'+lugar+'</div>'+flujo+'</div>'+
      ic+
    '</div>';
  }).join('');
}
/* ===== TEMA KAIROS: selector de modo/acento (copiado de Kairos) ===== */
var TEMAS_MODOS = { indigo: ['dark'], lmgreen: ['dark', 'light'], taisared: ['dark', 'light'], amber: ['dark'], retro80s: ['dark', 'light'] };
function toggleThemePanel() {
  var p = document.getElementById('themePanel');
  if (p) p.classList.toggle('abierto');
}
function setKModo(modo) {
  document.documentElement.setAttribute('data-kmode', modo);
  try { localStorage.setItem('taisa_mode_pick', modo); } catch (e) {}
  var actual = document.documentElement.getAttribute('data-ktheme');
  if (!TEMAS_MODOS[actual] || TEMAS_MODOS[actual].indexOf(modo) === -1) setKTema('retro80s'); else sincronizarPickers_();
}
function setKTema(nombre) {
  document.documentElement.setAttribute('data-ktheme', nombre);
  try { localStorage.setItem('taisa_theme_pick', nombre); } catch (e) {}
  sincronizarPickers_();
}
function sincronizarPickers_() {
  var modo = document.documentElement.getAttribute('data-kmode');
  var tema = document.documentElement.getAttribute('data-ktheme');
  var picks = document.querySelectorAll('.pick[data-mode]');
  for (var i = 0; i < picks.length; i++) picks[i].classList.toggle('active', picks[i].getAttribute('data-mode') === modo);
  picks = document.querySelectorAll('.pick[data-for]');
  for (var j = 0; j < picks.length; j++) {
    var p = picks[j];
    var nombre = p.getAttribute('data-for');
    p.toggleAttribute('data-hidden', TEMAS_MODOS[nombre].indexOf(modo) === -1);
    p.classList.toggle('active', nombre === tema);
  }
}
document.addEventListener('click', function (e) {
  var p = document.getElementById('themePanel');
  if (!p || !p.classList.contains('abierto')) return;
  if (e.target.closest('#themePanel') || e.target.closest('#temaBtn')) return;
  p.classList.remove('abierto');
});
sincronizarPickers_();
</script>
